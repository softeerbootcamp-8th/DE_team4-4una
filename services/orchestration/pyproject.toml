[project]
name = "orchestration"
version = "0.1.0"
description = "Orchestrates DE4 data workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "de4-core",
    # infra/compose/airflow.yaml의 apache/airflow:3.3.1-python3.12 이미지와 버전을 맞춰,
    # DAG 파싱/구조를 docker 없이 로컬 pytest로도 검증할 수 있게 한다.
    "apache-airflow>=3.3.1,<3.4.0",
    # weather_pipeline(#207)의 lightweight 날씨 수집 job이 쓴다 — Spark는 필요 없다.
    "psycopg2-binary>=2.9,<3.0",
    "pyarrow>=25.0.1",
    # weather_rules.yaml(날씨 보정 파라미터) 로드용. batch-jobs의 YAML 설정 규약과 같은 형식이다.
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
    # current_score_pipeline 행 단위 격리(#251)의 GX PandasExecutionEngine 검증에 쓴다.
    "great-expectations>=1.21.0",
    "pandas>=2.0.0",
    # bronze_compaction(#271)이 s3:// 경로를 압축할 때 ObjectStore가 쓰는 실제 S3
    # 클라이언트. de4-core도 이미 의존하지만, orchestration 자체 실행 환경(로컬
    # pytest, Airflow 컨테이너)에도 명시적으로 선언한다.
    "boto3>=1.40,<2.0",
    # standard_score_pipeline/data_quality_audit(#292, #295)이 EMR Serverless에
    # Job Run을 제출하는 EmrServerlessStartJobOperator를 여기서 가져온다(ADR-0001).
    "apache-airflow-providers-amazon>=9.0.0,<10.0.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
orchestration = "orchestration:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
