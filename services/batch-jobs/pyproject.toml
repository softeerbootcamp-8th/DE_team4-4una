[project]
name = "batch-jobs"
version = "0.1.0"
description = "Runs offline ride-comfort data jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "de4-core",
    "duckdb>=1.4.3",
    "pyproj>=3.7.2",
    "pyshp>=3.0.2",
    "shapely>=2.1.2",
]

[project.scripts]
batch-jobs = "batch_jobs:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
