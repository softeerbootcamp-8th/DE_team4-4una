# steering_rate / 조향 반전(steering reversal) 계산에 쓰는 설정값.
# sensor_features.config가 로드한다.
#
# provisional: true가 붙은 값은 나중에 바뀔 수 있다. 값이 바뀌면 이 파일의
# value만 갱신하면 된다.
#
# steering_rate_deadband_deg_per_sec는 #544에서 provisional을 뗐다 — event_features.yaml과 같은 결정으로, raw 기반 도출 없이 현재 값을 그대로 확정했다.

# 같은 trip 안에서 이전 이벤트를 유효한 이전 샘플로 볼 수 있는 최대 시간 간격(초).
# 이보다 큰 간격은 sensor sampling gap으로 간주해 steering_rate를 NULL로 만든다.
# 10Hz 정상 주기(0.1초)의 5배로 설정했다.
max_gap_seconds:
  value: 0.5
  provisional: true

# steering_rate(degree/second)의 절대값이 이 값 이하이면 유효한 조향 방향 변화로
# 보지 않는다(정지 상태·미세 보정 흔들림 제외). 조향 반전(steering reversal) 판정에 쓰인다.
steering_rate_deadband_deg_per_sec:
  value: 10.0
  provisional: false
