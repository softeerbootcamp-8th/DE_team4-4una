# 급가속·급제동·급조향 episode(hard_accel_event_start / hard_brake_event_start /
# sharp_steer_event_start) 계산에 쓰는 설정값. sensor_features.config가 로드한다.
#
# provisional: true가 붙은 값은 나중에 바뀔 수 있다. 값이 바뀌면 이 파일의 value만 갱신하면 된다.
#
# hard_accel/hard_brake/sharp_steer 세 threshold와 min_event_duration_seconds는 #544에서 provisional을 뗐다 — raw sensor 기반 후보 비교로 도출한 건 아니고, 이벤트가 극히 드물다는 것만 확인한 뒤(99.7%+ 0) 현재 값을 그대로 확정하기로 한 결정이다(후속 이슈에서 raw 기반 재검토 가능). max_gap_seconds는 이 결정에 안 들어가 provisional로 남긴다.

# 같은 trip 안에서 이전 이벤트를 유효한 이전 샘플로 볼 수 있는 최대 시간 간격(초).
# 이보다 큰 간격은 sensor sampling gap으로 간주해 episode를 이어붙이지 않는다.
# 10Hz 정상 주기(0.1초)의 5배로 설정했다.
max_gap_seconds:
  value: 0.5
  provisional: true

# accel_x(m/s^2)가 이 값 이상으로 유지되면 급가속 후보로 본다.
hard_accel_threshold_mps2:
  value: 3.0
  provisional: false

# accel_x(m/s^2)가 이 값 이하로 유지되면 급제동 후보로 본다. 이미 음수로 정의한다.
hard_brake_threshold_mps2:
  value: -3.0
  provisional: false

# 급가속/급제동 후보 구간(episode)이 이 시간(초) 이상 지속돼야 실제 이벤트로 인정한다.
# 순간적인 센서 노이즈로 인한 단일 샘플 스파이크를 제외하기 위함이다.
min_event_duration_seconds:
  value: 0.3
  provisional: false

# steering_rate(degree/second)의 절대값이 이 값 이상으로 유지되면 급조향 후보로 본다.
sharp_steer_threshold_deg_per_sec:
  value: 100.0
  provisional: false

# 급조향 후보 구간(episode)이 이 시간(초) 이상 지속돼야 실제 이벤트로 인정한다.
sharp_steer_min_duration_seconds:
  value: 0.3
  provisional: false
