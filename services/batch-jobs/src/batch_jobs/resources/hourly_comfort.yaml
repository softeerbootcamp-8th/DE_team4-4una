# 실제 Silver2 분포가 나오면 기준값과 scoring_version을 함께 갱신한다
scoring_version: hourly-comfort-v1
compatible_feature_versions: [hourly-features-v1]
minimum_valid_weight: 0.8

# 같은 움직임도 속도대별 정상 범위가 달라질 수 있어 앵커만 완만하게 보정한다
speed_bands:
  - {upper_mps: 5.0, anchor_scale: 0.9}
  - {upper_mps: 10.0, anchor_scale: 1.0}
  - {upper_mps: null, anchor_scale: 1.1}

normalizers:
  rms_accel_x: {comfortable: 0.15, uncomfortable: 1.5}
  rms_accel_y: {comfortable: 0.12, uncomfortable: 1.2}
  rms_accel_z: {comfortable: 0.10, uncomfortable: 1.0}
  p95_abs_accel_x: {comfortable: 0.40, uncomfortable: 3.0}
  p95_abs_accel_y: {comfortable: 0.35, uncomfortable: 2.5}
  p95_abs_accel_z: {comfortable: 0.30, uncomfortable: 2.0}
  rms_jerk_x: {comfortable: 0.50, uncomfortable: 6.0}
  rms_jerk_y: {comfortable: 0.50, uncomfortable: 6.0}
  rms_jerk_z: {comfortable: 0.50, uncomfortable: 8.0}
  p95_abs_jerk_x: {comfortable: 1.50, uncomfortable: 15.0}
  p95_abs_jerk_y: {comfortable: 1.50, uncomfortable: 15.0}
  p95_abs_jerk_z: {comfortable: 2.00, uncomfortable: 20.0}
  hard_brake_rate: {comfortable: 0.0, uncomfortable: 2.0}
  hard_accel_rate: {comfortable: 0.0, uncomfortable: 2.0}
  sharp_steer_rate: {comfortable: 0.0, uncomfortable: 2.0}
  steer_reversal_rate: {comfortable: 0.5, uncomfortable: 5.0}
  rms_steering_rate: {comfortable: 2.0, uncomfortable: 30.0}
  rms_steering_vibration: {comfortable: 0.05, uncomfortable: 1.0}

components:
  vertical_score:
    rms_accel_z: 0.35
    p95_abs_accel_z: 0.20
    rms_jerk_z: 0.20
    p95_abs_jerk_z: 0.15
    rms_steering_vibration: 0.10
  longitudinal_score:
    rms_accel_x: 0.25
    p95_abs_accel_x: 0.15
    rms_jerk_x: 0.20
    p95_abs_jerk_x: 0.15
    hard_brake_rate: 0.15
    hard_accel_rate: 0.10
  lateral_score:
    rms_accel_y: 0.25
    p95_abs_accel_y: 0.15
    rms_jerk_y: 0.15
    p95_abs_jerk_y: 0.10
    sharp_steer_rate: 0.15
    rms_steering_rate: 0.15
    steer_reversal_rate: 0.05
