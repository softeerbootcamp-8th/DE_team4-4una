# Gold segment_comfort_score 산출식 파라미터 (context/comfort-score.md 참고).
# 전부 provisional: true — 실제 데이터로 재산정하기 전까지의 잠정값이다 (이슈 #102는
# k의 최종 확정 수치를 제외 범위로 명시함).

# 시간대별 방향 점수 결합 가중치 (수직:종방향:횡방향 = 5:3:2, 합이 1.0이어야 함)
vertical_weight:
  value: 0.5
  provisional: true
longitudinal_weight:
  value: 0.3
  provisional: true
lateral_weight:
  value: 0.2
  provisional: true

# evidence weight e_h = min(1, trip_count_h / evidence_saturation_trip_count)가
# 1.0(포화)에 도달하는 시간당 차량 통행 수 — hard cutoff(T_min) 대신 연속 가중치로
# 반영한다(#566). trip_count가 이 값보다 적어도 0은 아닌 부분 evidence로 인정된다.
evidence_saturation_trip_count:
  value: 5.0
  provisional: true

# Shrinkage 강도, 단위는 "시간" (k). 실제 데이터에서 within/between-segment
# 분산비로 재산정 예정 — 여기 값(10)은 comfort-score.md의 예시와 맞춘 잠정값.
shrinkage_k:
  value: 10.0
  provisional: true
