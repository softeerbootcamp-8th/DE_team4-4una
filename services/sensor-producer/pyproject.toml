[project]
name = "sensor-producer"
version = "0.1.0"
description = "Produces vehicle sensor events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "de4-core",
    "geopandas>=1.1.4",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[project.scripts]
sensor-producer = "sensor_producer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
