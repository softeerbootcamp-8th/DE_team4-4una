[project]
name = "sensor-producer"
version = "0.1.0"
description = "Produces vehicle sensor events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "de4-core",
    "duckdb>=1.4.3",
    "geopandas>=1.1.4",
    "kafka-python-ng>=2.2.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "pyshp>=3.0.2",
    "shapely>=2.1.2",
]

[project.scripts]
sensor-producer = "sensor_producer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
