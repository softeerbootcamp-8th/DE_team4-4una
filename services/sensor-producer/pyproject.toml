[project]
name = "sensor-producer"
version = "0.1.0"
description = "Produces vehicle sensor events"
requires-python = ">=3.12,<3.13"
dependencies = ["de4-core"]

[project.scripts]
sensor-producer = "sensor_producer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
