[project]
name = "pipeline-perf"
version = "0.1.0"
description = "Collects and reports comfort-score pipeline performance baselines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "de4-core",
    "boto3>=1.40,<2.0",
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
pipeline-perf = "pipeline_perf.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
