[project]
name = "de4"
version = "0.1.0"
description = "Build a standardized ride-comfort dataset for route recommendation"
readme = "README.md"
authors = [
    { name = "Kijoon Jeong", email = "jkijoon701@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.uv.sources]
de4-core = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/*",
    "services/*",
]
