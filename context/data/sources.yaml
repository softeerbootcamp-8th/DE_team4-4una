version: 0.2.0
last_reviewed: 2026-08-10
status: draft

sources:
  - id: nyc_street_pavement_ratings
    role: Monthly road-condition reference
    expected_grain: One pavement-rating observation per source-defined road unit and survey period
    refresh_cadence: monthly
    required_uses:
      - Pavement-condition feature
      - Spatial mapping to canonical LION segments
    open_items:
      - Official source URL and download method
      - Exact field schema and identifier stability
      - Snapshot selection rule when the source updates more or less often than monthly
      - Mapping from rating values to simulation inputs

  - id: nyc_speed_humps
    role: Monthly road-obstacle reference
    expected_grain: One source record per speed-hump location or installation
    refresh_cadence: monthly
    required_uses:
      - Spatially attach hump locations to canonical road segments
      - Generate deterministic hump traversal effects
    open_items:
      - Official source URL and download method
      - Geometry type, units, and coordinate reference system
      - Handling of multiple humps and records near intersections

  - id: nyc_lion
    role: Road topology and canonical segment reference
    expected_grain: One record per source-defined street segment
    refresh_cadence: monthly
    required_uses:
      - Canonical SegmentID
      - Routable graph and road geometry
      - Road attributes used by simulation
    open_items:
      - Official source version and acquisition method
      - Directionality and connectivity rules
      - Identifier versioning across releases

  - id: osm_traffic_signals
    role: Monthly traffic-control reference
    expected_grain: One OpenStreetMap traffic-signal node
    refresh_cadence: monthly
    required_uses:
      - Spatially attach traffic-signal counts to canonical LION segments
      - Preserve raw OSM tags for future feature promotion
    open_items:
      - Accepted Overpass query and geographic boundary
      - Snapshot retention and attribution requirements
      - Matching tolerance and treatment of signals near segment intersections

  - id: tlc_taxi_zones
    role: Pickup and drop-off spatial constraint
    expected_grain: One geometry per TLC LocationID
    refresh_cadence: monthly
    required_uses:
      - Map HVFHV pickup and drop-off LocationIDs to polygons
      - Select deterministic valid road endpoints inside polygons
    open_items:
      - Official lookup and geometry source URLs
      - Boundary and no-road handling
      - LocationID version compatibility with the chosen HVFHV month

  - id: tlc_hvfhv_trip_records
    role: Passenger-trip simulation input
    expected_grain: One completed trip record
    refresh_cadence: one pinned source day per demonstration run
    required_uses:
      - Request-time dispatch ordering
      - Pickup and drop-off taxi zones
      - Pickup-to-drop-off passenger-trip duration and available distance signals
      - Deterministic sampling of approximately 1000 trips
    open_items:
      - Source month and day
      - Eligible-row filters
      - Stable row identity when no unique trip ID is supplied
      - Sampling and vehicle-assignment algorithms
      - Treatment of overlapping trips and long dispatch gaps

source_snapshot_metadata:
  required_fields:
    - source_id
    - snapshot_id
    - source_uri
    - retrieved_at
    - source_period_or_version
    - content_checksum
    - file_format
    - row_count
    - schema_fingerprint
    - ingestion_run_id
