# main에 들어간 Orchestration 이미지를 ECR에 배포하고 EC2에 준비한다.

name: Deploy Orchestration

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-orchestration
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm

    env:
      REVISION: ${{ github.sha }}
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      # git clone/pull 대신 러너가 이미 checkout한 트리를 rsync로 미는 방식이라,
      # EC2에 새 GitHub 자격증명(deploy key 등)이 필요 없다.
      REPO_DIR: ${{ vars.ORCHESTRATION_REPO_DIR || '/home/ec2-user/DE_team4-4una' }}
      ENV_FILE: ${{ vars.ORCHESTRATION_ENV_FILE || '/etc/orchestration/orchestration.env' }}
      HEALTH_PATH: /api/v2/monitor/health
      HEALTH_TIMEOUT: "180"

    steps:
      - name: Check required variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ORCHESTRATION_ECR_REPOSITORY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=""
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EC2_HOST EC2_SSH_PRIVATE_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::필수 설정값이 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ORCHESTRATION_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${REPOSITORY}:${REVISION}"

          docker build \
            --tag "$image" \
            --file services/orchestration/Dockerfile \
            --label "org.opencontainers.image.revision=${REVISION}" \
            .

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull image on EC2
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "aws ecr get-login-password --region '$AWS_REGION' \
            | docker login --username AWS --password-stdin '$REGISTRY' \
            && docker pull '$IMAGE' \
            && docker tag '$IMAGE' 'orchestration:$REVISION'"

      - name: Sync repository to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '$REPO_DIR'"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='data/' \
            --exclude='dist/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.ruff_cache/' \
            -e 'ssh -o StrictHostKeyChecking=yes' \
            ./ "${EC2_USER}@${EC2_HOST}:${REPO_DIR}/"

      - name: Start Airflow via docker compose
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "cd '$REPO_DIR' \
            && AWS_REGION='$AWS_REGION' AWS_DEFAULT_REGION='$AWS_REGION' \
            docker compose --env-file '$ENV_FILE' -f infra/compose/airflow.yaml up -d"

      - name: Wait for Airflow health
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "REPO_DIR='$REPO_DIR' HEALTH_PATH='$HEALTH_PATH' HEALTH_TIMEOUT='$HEALTH_TIMEOUT' bash -s" <<'EOF'
          set -euo pipefail

          elapsed=0
          interval=5

          while true; do
            response=$(curl -sf "http://localhost:8080${HEALTH_PATH}" || true)

            if echo "$response" | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          ok = all(data.get(c, {}).get("status") == "healthy" for c in ("metadatabase", "scheduler"))
          sys.exit(0 if ok else 1)
          '; then
              echo "Airflow is healthy."
              exit 0
            fi

            if [ "$elapsed" -ge "$HEALTH_TIMEOUT" ]; then
              echo "::error::Airflow health check timed out after ${HEALTH_TIMEOUT}s. Last response: $response"
              cd "$REPO_DIR"
              docker compose -f infra/compose/airflow.yaml logs --tail=200
              exit 1
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done
          EOF

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          JOB_STATUS: ${{ job.status }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          {
            echo "### Orchestration 배포"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`$REVISION\` |"
            echo "| image | \`${IMAGE:-(빌드 전 중단)}\` |"
            echo "| local tag | \`orchestration:$REVISION\` |"
            echo "| host | \`${EC2_USER}@${EC2_HOST:-(미설정)}\` |"
            echo "| repo dir | \`$REPO_DIR\` |"
            echo "| health | \`http://localhost:8080${HEALTH_PATH}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
