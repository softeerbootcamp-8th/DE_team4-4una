# main에 들어간 Sensor Producer 이미지를 ECR에 배포한다.
# ci.yml이 CI 통과 후 호출하는 reusable workflow다.

name: Deploy Sensor Producer

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-sensor-producer
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # EC2가 arm64(t4g)이므로 동일한 아키텍처로 이미지를 빌드한다.
    runs-on: ubuntu-24.04-arm

    env:
      REVISION: ${{ github.sha }}

    steps:
      - name: Check required variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.SENSOR_PRODUCER_ECR_REPOSITORY }}
        run: |
          missing=""
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::repository variables가 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.SENSOR_PRODUCER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${REPOSITORY}:${REVISION}"

          docker build \
            --tag "$image" \
            --file services/sensor-producer/Dockerfile \
            --label "org.opencontainers.image.revision=${REVISION}" \
            .

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Sensor Producer 배포"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`$REVISION\` |"
            echo "| image | \`${IMAGE:-(빌드 전 중단)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"