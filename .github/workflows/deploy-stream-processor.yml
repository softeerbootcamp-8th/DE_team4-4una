# develop에 들어간 Stream Processor 이미지를 ECR에 배포하고
# EC2의 Spark Structured Streaming 컨테이너를 새 이미지로 교체한다.
#
# CI를 기다리지 않는다. develop 병합은 branch protection의 required status check
# ("CI Passed")을 통과해야만 가능하므로, develop에 올라온 시점에 이미 검증된 커밋이다.

name: Deploy Stream Processor

on:
  # 이미지에 실제로 들어가는 경로만 본다. Dockerfile이 COPY . . 뒤에
  # `uv sync --package stream-processor`를 하므로 산출물을 바꾸는 것은 이 서비스와
  # 공유 코드뿐이다.
  push:
    branches: [develop]
    paths:
      - 'services/stream-processor/**'
      - 'libs/de4-core/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-stream-processor.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-stream-processor
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm

    env:
      REVISION: ${{ github.sha }}
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      CONTAINER: stream-processor
      KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS || 'localhost:9092' }}
      KAFKA_SENSOR_TOPIC: ${{ vars.KAFKA_SENSOR_TOPIC || 'sensor-events' }}
      STREAM_METRICS_PORT: ${{ vars.STREAM_METRICS_PORT || '9103' }}
      BRONZE_OUTPUT_PATH: ${{ vars.STREAM_BRONZE_OUTPUT_PATH }}
      BRONZE_CHECKPOINT_LOCATION: ${{ vars.STREAM_BRONZE_CHECKPOINT_LOCATION }}
    steps:
      - name: Check required variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.STREAM_PROCESSOR_ECR_REPOSITORY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          BRONZE_OUTPUT_PATH: ${{ vars.STREAM_BRONZE_OUTPUT_PATH }}
          BRONZE_CHECKPOINT_LOCATION: ${{ vars.STREAM_BRONZE_CHECKPOINT_LOCATION }}
        run: |
          missing=""

          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EC2_HOST EC2_SSH_PRIVATE_KEY \
            BRONZE_OUTPUT_PATH BRONZE_CHECKPOINT_LOCATION; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::필수 설정값이 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.STREAM_PROCESSOR_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${REPOSITORY}:${REVISION}"

          docker build \
            --platform linux/arm64 \
            --tag "$image" \
            --file services/stream-processor/Dockerfile \
            --label "org.opencontainers.image.revision=${REVISION}" \
            .

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "IMAGE='$IMAGE' \
             REGISTRY='$REGISTRY' \
             AWS_REGION='$AWS_REGION' \
             CONTAINER='$CONTAINER' \
             KAFKA_BOOTSTRAP_SERVERS='$KAFKA_BOOTSTRAP_SERVERS' \
             KAFKA_SENSOR_TOPIC='$KAFKA_SENSOR_TOPIC' \
             STREAM_METRICS_PORT='$STREAM_METRICS_PORT' \
             BRONZE_OUTPUT_PATH='$BRONZE_OUTPUT_PATH' \
             BRONZE_CHECKPOINT_LOCATION='$BRONZE_CHECKPOINT_LOCATION' \
             REVISION='$REVISION' \
             bash -s" <<'EOF'
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # 운영 적재가 로컬 경로로 조용히 폴백되지 않도록 S3A URI만 허용한다.
          for uri in "$BRONZE_OUTPUT_PATH" "$BRONZE_CHECKPOINT_LOCATION"; do
            case "$uri" in
              s3a://*) ;;
              *)
                echo "Stream Processor path must use s3a://: $uri"
                exit 1
                ;;
            esac

            bucket_and_key="${uri#s3a://}"
            bucket="${bucket_and_key%%/*}"
            aws s3api head-bucket --bucket "$bucket"
          done

          docker rm -f "$CONTAINER" 2>/dev/null || true

          # Kafka는 같은 EC2의 docker compose 컨테이너로 떠 있다. 기본 브리지
          # 네트워크에서는 localhost가 이 컨테이너 자신을 가리켜 못 붙으므로,
          # 호스트 네트워크를 그대로 써서 .env의 KAFKA_BOOTSTRAP_SERVERS가
          # localhost:9092를 가리켜도 맞게 한다.
          docker run -d \
            --name "$CONTAINER" \
            --network host \
            --restart unless-stopped \
            -e AWS_REGION="$AWS_REGION" \
            -e AWS_DEFAULT_REGION="$AWS_REGION" \
            -e KAFKA_BOOTSTRAP_SERVERS="$KAFKA_BOOTSTRAP_SERVERS" \
            -e KAFKA_SENSOR_TOPIC="$KAFKA_SENSOR_TOPIC" \
            -e KAFKA_STARTING_OFFSETS=earliest \
            -e STREAM_METRICS_PORT="$STREAM_METRICS_PORT" \
            -e STREAM_SPARK_MASTER='local[*]' \
            -e STREAM_TRIGGER_INTERVAL_SECONDS=5 \
            -e STREAM_MIN_OFFSETS_PER_TRIGGER=600000 \
            -e STREAM_MAX_TRIGGER_DELAY=5m \
            -e STREAM_BRONZE_OUTPUT_PARTITIONS=1 \
            -e STREAM_BRONZE_OUTPUT_PATH="$BRONZE_OUTPUT_PATH" \
            -e STREAM_BRONZE_CHECKPOINT_LOCATION="$BRONZE_CHECKPOINT_LOCATION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            "$IMAGE"

          query_started=false
          for _ in $(seq 1 12); do
            state="$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
            if [ "$state" != "running" ]; then
              echo "Stream Processor failed while starting: state=$state"
              docker logs "$CONTAINER" --tail 100
              exit 1
            fi

            if grep -q "stream query started" < <(docker logs "$CONTAINER" 2>&1); then
              query_started=true
              break
            fi
            sleep 5
          done

          if [ "$query_started" != "true" ]; then
            echo "Stream Processor query did not start within 60 seconds."
            docker logs "$CONTAINER" --tail 100
            exit 1
          fi

          # query 시작 직후 Kafka/S3 오류로 재시작하는 경우도 배포 실패로 판정한다.
          sleep 10

          state="$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
          restarts="$(docker inspect -f '{{.RestartCount}}' "$CONTAINER" 2>/dev/null || echo 1)"
          if [ "$state" != "running" ] || [ "$restarts" -ne 0 ]; then
            echo "Stream Processor is unhealthy: state=$state restarts=$restarts"
            docker logs "$CONTAINER" --tail 100
            exit 1
          fi

          # --network host라 별도 -p 매핑 없이 localhost로 바로 확인한다.
          if ! curl -fsS "http://localhost:${STREAM_METRICS_PORT}/metrics" > /dev/null; then
            echo "Stream Processor metrics endpoint is not responding on port ${STREAM_METRICS_PORT}."
            docker logs "$CONTAINER" --tail 100
            exit 1
          fi
          EOF

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Stream Processor 배포"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`$REVISION\` |"
            echo "| image | \`${IMAGE:-(빌드 전 중단)}\` |"
            echo "| host | \`${EC2_USER}@${EC2_HOST:-(미설정)}\` |"
            echo "| container | \`$CONTAINER\` |"
            echo "| bronze | \`${BRONZE_OUTPUT_PATH:-(미설정)}\` |"
            echo "| checkpoint | \`${BRONZE_CHECKPOINT_LOCATION:-(미설정)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
