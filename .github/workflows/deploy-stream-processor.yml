# 수동 요청 시 Stream Processor 이미지를 ECR에 배포하고
# EC2의 Spark Structured Streaming 컨테이너를 새 이미지로 교체한다.
#
# develop 병합만으로는 운영 EC2를 변경하지 않는다. 운영 스트림은 명시적인
# workflow_dispatch 요청으로 배포한다.

name: Deploy Stream Processor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-stream-processor
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm

    env:
      REVISION: ${{ github.sha }}
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      CONTAINER: stream-processor
      KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS || 'localhost:9092' }}
      KAFKA_SENSOR_TOPIC: ${{ vars.KAFKA_SENSOR_TOPIC || 'sensor-events' }}
      STREAM_METRICS_PORT: ${{ vars.STREAM_METRICS_PORT || '9103' }}
      STREAM_MAX_OFFSETS_PER_TRIGGER: ${{ vars.STREAM_MAX_OFFSETS_PER_TRIGGER || '1200000' }}
      STREAM_DRIVER_MEMORY: ${{ vars.STREAM_DRIVER_MEMORY || '4g' }}
      BRONZE_OUTPUT_PATH: ${{ vars.STREAM_BRONZE_OUTPUT_PATH }}
      BRONZE_CHECKPOINT_LOCATION: ${{ vars.STREAM_BRONZE_CHECKPOINT_LOCATION }}
    steps:
      - name: Check required variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.STREAM_PROCESSOR_ECR_REPOSITORY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          BRONZE_OUTPUT_PATH: ${{ vars.STREAM_BRONZE_OUTPUT_PATH }}
          BRONZE_CHECKPOINT_LOCATION: ${{ vars.STREAM_BRONZE_CHECKPOINT_LOCATION }}
        run: |
          missing=""

          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EC2_HOST EC2_SSH_PRIVATE_KEY \
            BRONZE_OUTPUT_PATH BRONZE_CHECKPOINT_LOCATION; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::필수 설정값이 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.STREAM_PROCESSOR_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${REPOSITORY}:${REVISION}"

          docker build \
            --platform linux/arm64 \
            --tag "$image" \
            --file services/stream-processor/Dockerfile \
            --label "org.opencontainers.image.revision=${REVISION}" \
            .

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "IMAGE='$IMAGE' \
             REGISTRY='$REGISTRY' \
             AWS_REGION='$AWS_REGION' \
             CONTAINER='$CONTAINER' \
             KAFKA_BOOTSTRAP_SERVERS='$KAFKA_BOOTSTRAP_SERVERS' \
             KAFKA_SENSOR_TOPIC='$KAFKA_SENSOR_TOPIC' \
             STREAM_METRICS_PORT='$STREAM_METRICS_PORT' \
             STREAM_MAX_OFFSETS_PER_TRIGGER='$STREAM_MAX_OFFSETS_PER_TRIGGER' \
             STREAM_DRIVER_MEMORY='$STREAM_DRIVER_MEMORY' \
             BRONZE_OUTPUT_PATH='$BRONZE_OUTPUT_PATH' \
             BRONZE_CHECKPOINT_LOCATION='$BRONZE_CHECKPOINT_LOCATION' \
             REVISION='$REVISION' \
             bash -s" <<'EOF'
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # 운영 적재가 로컬 경로로 조용히 폴백되지 않도록 S3A URI만 허용한다.
          for uri in "$BRONZE_OUTPUT_PATH" "$BRONZE_CHECKPOINT_LOCATION"; do
            case "$uri" in
              s3a://*) ;;
              *)
                echo "Stream Processor path must use s3a://: $uri"
                exit 1
                ;;
            esac

            bucket_and_key="${uri#s3a://}"
            bucket="${bucket_and_key%%/*}"
            aws s3api head-bucket --bucket "$bucket"
          done

          # 실패하면 되돌릴 대상. 첫 배포면 빈 값이고, 그때는 되돌릴 상태가 없다.
          PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)"
          echo "이전 이미지: ${PREVIOUS_IMAGE:-(없음)}"

          # rollback 때 같은 절차로 이전 이미지를 다시 띄워야 해서 함수로 감쌌다.
          # 안의 내용은 바뀌지 않았고, 이미지와 revision만 인자로 받는다.
          # STREAM_MAX_OFFSETS_PER_TRIGGER와 STREAM_DRIVER_MEMORY는 복구 경로를
          # 위한 값이다(#482). 상한이 없으면 장애 후 첫 배치가 쌓인 offset을 전부
          # 단일 태스크(coalesce(1))로 처리하려다 OOM이 나고, --restart
          # unless-stopped가 같은 범위를 다시 시도해 crash loop가 된다. heap은
          # heap은 cli.build_spark_session이 STREAM_DRIVER_MEMORY로 설정한다.
          start_container() {
            docker rm -f "$CONTAINER" 2>/dev/null || true

            # Kafka는 같은 EC2의 docker compose 컨테이너로 떠 있다. 기본 브리지
            # 네트워크에서는 localhost가 이 컨테이너 자신을 가리켜 못 붙으므로,
            # 호스트 네트워크를 그대로 써서 .env의 KAFKA_BOOTSTRAP_SERVERS가
            # localhost:9092를 가리켜도 맞게 한다.
            docker run -d \
              --name "$CONTAINER" \
              --network host \
              --restart unless-stopped \
              -e AWS_REGION="$AWS_REGION" \
              -e AWS_DEFAULT_REGION="$AWS_REGION" \
              -e KAFKA_BOOTSTRAP_SERVERS="$KAFKA_BOOTSTRAP_SERVERS" \
              -e KAFKA_SENSOR_TOPIC="$KAFKA_SENSOR_TOPIC" \
              -e KAFKA_STARTING_OFFSETS=earliest \
              -e STREAM_METRICS_PORT="$STREAM_METRICS_PORT" \
              -e STREAM_SPARK_MASTER='local[*]' \
              -e STREAM_TRIGGER_INTERVAL_SECONDS=5 \
              -e STREAM_MIN_OFFSETS_PER_TRIGGER=600000 \
              -e STREAM_MAX_OFFSETS_PER_TRIGGER="$STREAM_MAX_OFFSETS_PER_TRIGGER" \
              -e STREAM_DRIVER_MEMORY="$STREAM_DRIVER_MEMORY" \
              -e STREAM_MAX_TRIGGER_DELAY=5m \
              -e STREAM_BRONZE_OUTPUT_PARTITIONS=1 \
              -e STREAM_BRONZE_OUTPUT_PATH="$BRONZE_OUTPUT_PATH" \
              -e STREAM_BRONZE_CHECKPOINT_LOCATION="$BRONZE_CHECKPOINT_LOCATION" \
              --label "org.opencontainers.image.revision=$2" \
              "$1"
          }

          # 검사 내용은 그대로다. rollback 여부를 호출한 쪽이 정해야 해서 실패를
          # exit 1 대신 return 1로 알린다.
          smoke_check() {
            query_started=false
            for _ in $(seq 1 12); do
              state="$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
              if [ "$state" != "running" ]; then
                echo "Stream Processor failed while starting: state=$state"
                docker logs "$CONTAINER" --tail 100
                return 1
              fi

              if grep -q "stream query started" < <(docker logs "$CONTAINER" 2>&1); then
                query_started=true
                break
              fi
              sleep 5
            done

            if [ "$query_started" != "true" ]; then
              echo "Stream Processor query did not start within 60 seconds."
              docker logs "$CONTAINER" --tail 100
              return 1
            fi

            # query 시작 직후 Kafka/S3 오류로 재시작하는 경우도 배포 실패로 판정한다.
            sleep 10

            state="$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
            restarts="$(docker inspect -f '{{.RestartCount}}' "$CONTAINER" 2>/dev/null || echo 1)"
            if [ "$state" != "running" ] || [ "$restarts" -ne 0 ]; then
              echo "Stream Processor is unhealthy: state=$state restarts=$restarts"
              docker logs "$CONTAINER" --tail 100
              return 1
            fi

            # --network host라 별도 -p 매핑 없이 localhost로 바로 확인한다.
            if ! curl -fsS "http://localhost:${STREAM_METRICS_PORT}/metrics" > /dev/null; then
              echo "Stream Processor metrics endpoint is not responding on port ${STREAM_METRICS_PORT}."
              docker logs "$CONTAINER" --tail 100
              return 1
            fi

            return 0
          }

          # 현재 이미지와 rollback용 직전 이미지만 남기고 이 리포지터리의 나머지
          # 태그를 지운다. 정리가 없어서 배포마다 <repo>:<sha>가 쌓였고, 실제로
          # EC2에 no space left on device가 났다. `docker image prune -af`는 쓰면
          # 안 된다 — 이 EC2에는 Kafka, Airflow, exporter 이미지가 함께 있다.
          prune_old_images() {
            keep_current="$1"
            keep_previous="$2"
            repo="${keep_current%:*}"

            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              [ "$ref" = "$keep_current" ] && continue
              [ -n "$keep_previous" ] && [ "$ref" = "$keep_previous" ] && continue

              if docker rmi "$ref" >/dev/null 2>&1; then
                echo "이미지 삭제: $ref"
              else
                # 다른 컨테이너가 쓰고 있으면 실패한다. 정리는 부가 작업이라
                # 배포를 깨지 않는다.
                echo "이미지 삭제 실패(사용 중일 수 있음): $ref"
              fi
            done < <(docker images --filter "reference=${repo}:*" --format '{{.Repository}}:{{.Tag}}')
          }

          start_container "$IMAGE" "$REVISION"

          if smoke_check; then
            echo "배포 성공: $IMAGE"
            prune_old_images "$IMAGE" "$PREVIOUS_IMAGE"
            exit 0
          fi

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "되돌릴 이전 이미지가 없습니다 (첫 배포)."
            exit 1
          fi

          # checkpoint는 그대로 두고 이미지만 되돌린다. 새 이미지가 이미 배치를
          # 커밋했다면 이전 버전이 그 checkpoint를 이어받는다. 두 버전의 state
          # 포맷이 다르면 되돌린 쪽도 못 뜰 수 있고, 그때는 아래 로그에 남는다.
          echo "rollback: $PREVIOUS_IMAGE"
          PREVIOUS_REVISION="$(
            docker inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$PREVIOUS_IMAGE" 2>/dev/null || echo unknown
          )"
          start_container "$PREVIOUS_IMAGE" "$PREVIOUS_REVISION"

          if smoke_check; then
            echo "rollback 후 정상. 배포는 실패로 처리한다."
          else
            echo "rollback 후에도 smoke check 실패. 수동 확인이 필요하다."
          fi

          exit 1
          EOF

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Stream Processor 배포"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`$REVISION\` |"
            echo "| image | \`${IMAGE:-(빌드 전 중단)}\` |"
            echo "| host | \`${EC2_USER}@${EC2_HOST:-(미설정)}\` |"
            echo "| container | \`$CONTAINER\` |"
            echo "| bronze | \`${BRONZE_OUTPUT_PATH:-(미설정)}\` |"
            echo "| checkpoint | \`${BRONZE_CHECKPOINT_LOCATION:-(미설정)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
