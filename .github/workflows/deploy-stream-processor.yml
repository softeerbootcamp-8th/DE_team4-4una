# main에 들어간 Stream Processor 이미지를 ECR에 배포하고
# EC2의 Spark Structured Streaming 컨테이너를 새 이미지로 교체한다.

name: Deploy Stream Processor

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-stream-processor
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm

    env:
      REVISION: ${{ github.sha }}
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      CONTAINER: stream-processor
      ENV_FILE: /home/ec2-user/DE_team4-4una/.env
      DATA_DIR: /home/ec2-user/stream-processor-data
    steps:
      - name: Check required variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.STREAM_PROCESSOR_ECR_REPOSITORY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=""

          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EC2_HOST EC2_SSH_PRIVATE_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::필수 설정값이 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.STREAM_PROCESSOR_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${REPOSITORY}:${REVISION}"

          docker build \
            --platform linux/arm64 \
            --tag "$image" \
            --file services/stream-processor/Dockerfile \
            --label "org.opencontainers.image.revision=${REVISION}" \
            .

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "IMAGE='$IMAGE' \
             REGISTRY='$REGISTRY' \
             AWS_REGION='$AWS_REGION' \
             CONTAINER='$CONTAINER' \
             ENV_FILE='$ENV_FILE' \
             DATA_DIR='$DATA_DIR' \
             REVISION='$REVISION' \
             bash -s" <<'EOF'
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # 컨테이너가 교체되어도 Bronze / checkpoint는 EC2에 유지한다.
          mkdir -p \
            "$DATA_DIR/bronze" \
            "$DATA_DIR/checkpoints"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Stream Processor env file not found: $ENV_FILE"
            exit 1
          fi

          docker rm -f "$CONTAINER" 2>/dev/null || true

          # Kafka는 같은 EC2의 docker compose 컨테이너로 떠 있다. 기본 브리지
          # 네트워크에서는 localhost가 이 컨테이너 자신을 가리켜 못 붙으므로,
          # 호스트 네트워크를 그대로 써서 .env의 KAFKA_BOOTSTRAP_SERVERS가
          # localhost:9092를 가리켜도 맞게 한다.
          docker run -d \
            --name "$CONTAINER" \
            --network host \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -e STREAM_BRONZE_OUTPUT_PATH=/data/bronze/sensor-events \
            -e STREAM_BRONZE_CHECKPOINT_LOCATION=/data/checkpoints/bronze-sensor-events \
            -v "$DATA_DIR/bronze:/data/bronze" \
            -v "$DATA_DIR/checkpoints:/data/checkpoints" \
            --label "org.opencontainers.image.revision=$REVISION" \
            "$IMAGE"

          sleep 10

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
            echo "Stream Processor failed to start."
            docker logs "$CONTAINER" --tail 100
            exit 1
          fi
          EOF

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Stream Processor 배포"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`$REVISION\` |"
            echo "| image | \`${IMAGE:-(빌드 전 중단)}\` |"
            echo "| host | \`${EC2_USER}@${EC2_HOST:-(미설정)}\` |"
            echo "| container | \`$CONTAINER\` |"
          } >> "$GITHUB_STEP_SUMMARY"