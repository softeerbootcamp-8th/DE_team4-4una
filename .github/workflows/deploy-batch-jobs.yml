# develop에 들어간 Batch Jobs 이미지를 ECR에 배포하고
# EMR Serverless Application이 새 이미지를 사용하도록 갱신한다.
#
# CI를 기다리지 않는다. develop 병합은 branch protection의 required status check
# ("CI Passed")을 통과해야만 가능하므로, develop에 올라온 시점에 이미 검증된 커밋이다.

name: Deploy Batch Jobs

on:
  # 이미지에 실제로 들어가는 경로만 본다. 이미지는 EMR Serverless가 pull하므로
  # EC2에는 쌓이지 않는다.
  push:
    branches: [develop]
    paths:
      - 'services/batch-jobs/**'
      - 'libs/de4-core/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-batch-jobs.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-batch-jobs
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm

    env:
      REVISION: ${{ github.sha }}

    steps:
      - name: Check required variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.BATCH_JOBS_ECR_REPOSITORY }}
          EMR_APPLICATION_ID: ${{ vars.EMR_APPLICATION_ID }}
        run: |
          missing=""
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EMR_APPLICATION_ID; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::repository variables가 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.BATCH_JOBS_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${REPOSITORY}:${REVISION}"

          docker build \
            --platform linux/arm64 \
            --tag "$image" \
            --file services/batch-jobs/Dockerfile \
            --label "org.opencontainers.image.revision=${REVISION}" \
            .

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Update EMR Serverless application
        env:
          APPLICATION_ID: ${{ vars.EMR_APPLICATION_ID }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          aws emr-serverless update-application \
            --application-id "$APPLICATION_ID" \
            --image-configuration "{\"imageUri\":\"$IMAGE\"}"

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          APPLICATION_ID: ${{ vars.EMR_APPLICATION_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Batch Jobs 배포"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`$REVISION\` |"
            echo "| image | \`${IMAGE:-(빌드 전 중단)}\` |"
            echo "| EMR application | \`$APPLICATION_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"