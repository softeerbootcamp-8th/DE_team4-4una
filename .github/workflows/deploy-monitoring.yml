# 모니터링 설정을 두 EC2에 배포한다.
#
# 배포 호스트가 둘로 갈리므로 아래 select job이 변경 경로를 보고 필요한 쪽만 돌린다.
#   exporters  -> Project EC2    (node-exporter, cAdvisor)
#   monitoring -> Monitoring EC2 (Prometheus, Grafana)
#
# Prometheus/Grafana는 서드파티 이미지, ops-agent(#447)만 예외로 Monitoring EC2에서 저장소를 통째로 받아 직접 docker build한다(ECR 불필요).
name: Deploy Monitoring

on:
  # infra/monitoring/statsd는 여기 없다. Airflow StatsD Exporter가 쓰는 것이라 아래
  # rsync가 statsd/를 제외하고, 재기동은 deploy-orchestration.yml이 담당한다.
  # README와 .env.example은 배포에 영향이 없어 하위 디렉터리를 명시한다.
  # services/ops-agent 등 나머지는 ops-agent(#447)를 로컬 docker build하는 데 필요해서 추가했다.
  push:
    branches: [develop]
    paths:
      - 'infra/compose/monitoring.yaml'
      - 'infra/compose/exporters.yaml'
      - 'infra/monitoring/prometheus/**'
      - 'infra/monitoring/grafana/**'
      - 'services/ops-agent/**'
      - 'libs/de4-core/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-monitoring.yml'
  # 수동 실행에서는 경로 판정이 없으므로 어느 쪽을 돌릴지 직접 고른다.
  workflow_dispatch:
    inputs:
      deploy-exporters:
        description: Project EC2의 exporter를 배포한다
        type: boolean
        default: true
      deploy-monitoring-stack:
        description: Monitoring EC2의 Prometheus/Grafana를 배포한다
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # 위 push 필터는 "이 워크플로를 띄울지"만 정한다. 두 호스트 중 어디에 배포할지는
  # 여기서 다시 판정한다. 전에는 ci.yml의 select job이 하던 일이다.
  select:
    name: Select Targets
    runs-on: ubuntu-latest
    outputs:
      exporters: ${{ steps.select.outputs.exporters }}
      monitoring-stack: ${{ steps.select.outputs.monitoring-stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # 워크플로 자신이 양쪽에 다 들어간 것은, 워크플로를 고쳤으면 두 배포가 다
          # 돌아야 그 변경이 검증되기 때문이다.
          filters: |
            monitoring-stack:
              - 'infra/compose/monitoring.yaml'
              - 'infra/monitoring/prometheus/**'
              - 'infra/monitoring/grafana/**'
              - 'services/ops-agent/**'
              - 'libs/de4-core/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/deploy-monitoring.yml'
            exporters:
              - 'infra/compose/exporters.yaml'
              - '.github/workflows/deploy-monitoring.yml'

      - name: Resolve targets
        id: select
        env:
          EVENT: ${{ github.event_name }}
          FILTER_EXPORTERS: ${{ steps.filter.outputs.exporters }}
          FILTER_STACK: ${{ steps.filter.outputs.monitoring-stack }}
          INPUT_EXPORTERS: ${{ inputs.deploy-exporters }}
          INPUT_STACK: ${{ inputs.deploy-monitoring-stack }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            exporters="$INPUT_EXPORTERS"
            stack="$INPUT_STACK"
          else
            exporters="$FILTER_EXPORTERS"
            stack="$FILTER_STACK"
          fi

          echo "exporters=$exporters" >> "$GITHUB_OUTPUT"
          echo "monitoring-stack=$stack" >> "$GITHUB_OUTPUT"
          echo "배포 대상 — exporters: $exporters, monitoring-stack: $stack"

  exporters:
    name: Exporters (Project EC2)
    needs: select
    if: needs.select.outputs.exporters == 'true'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: deploy-monitoring-exporters
      cancel-in-progress: false
    env:
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      # deploy-orchestration이 저장소 전체를 --delete로 미는 경로와 겹치지 않게
      # 모니터링 전용 디렉터리를 쓴다.
      TARGET_DIR: ${{ vars.MONITORING_TARGET_DIR || '/home/ec2-user/de4-monitoring' }}
      HEALTH_TIMEOUT: "60"
    steps:
      - name: Check required variables
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=""
          for name in EC2_HOST SSH_PRIVATE_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::필수 설정값이 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose file
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '$TARGET_DIR/infra/compose'"

          # exporters.yaml의 볼륨은 모두 호스트 절대 경로(/proc, /sys, ...)라 이 파일
          # 하나만 있으면 동작한다.
          rsync -az \
            -e 'ssh -o StrictHostKeyChecking=yes' \
            infra/compose/exporters.yaml \
            "${EC2_USER}@${EC2_HOST}:${TARGET_DIR}/infra/compose/"

      - name: Start exporters
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" \
            "cd '$TARGET_DIR' \
            && docker compose -f infra/compose/exporters.yaml up -d"

      # compose 명령이 성공했다고 컨테이너가 살아 있는 것은 아니다. 실제로 메트릭을
      # 내놓는지 확인해야 "정상 기동"을 검증한 것이 된다.
      - name: Wait for exporters
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" "HEALTH_TIMEOUT='$HEALTH_TIMEOUT' bash -s" <<'EOF'
          set -euo pipefail

          # 반복 횟수가 아니라 시계로 제한한다. 횟수로 세면 curl이 max-time까지 물릴 때
          # 전체 대기가 HEALTH_TIMEOUT를 몇 배로 넘긴다.
          wait_for() {
            name="$1"
            url="$2"
            interval=3
            deadline=$(( $(date +%s) + HEALTH_TIMEOUT ))

            while [ "$(date +%s)" -lt "$deadline" ]; do
              if curl --fail --silent \
                --connect-timeout 5 --max-time 10 \
                "$url" >/dev/null 2>&1; then
                printf '[health] %s 정상\n' "$name"
                return 0
              fi
              sleep "$interval"
            done

            printf '[health] %s 실패 (%s)\n' "$name" "$url"
            docker logs --tail 30 "$name" 2>&1 || true
            return 1
          }

          wait_for node-exporter http://localhost:9100/metrics
          wait_for cadvisor http://localhost:8081/metrics
          EOF

      - name: Job summary
        if: always()
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Exporters 배포 (Project EC2)"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| host | \`${EC2_USER}@${EC2_HOST:-(미설정)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  monitoring:
    name: Monitoring stack (Monitoring EC2)
    needs: select
    if: needs.select.outputs.monitoring-stack == 'true'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: deploy-monitoring-stack
      cancel-in-progress: false
    env:
      EC2_USER: ${{ vars.MONITORING_EC2_USER || vars.EC2_USER || 'ec2-user' }}
      TARGET_DIR: ${{ vars.MONITORING_TARGET_DIR || '/home/ec2-user/de4-monitoring' }}
      # Grafana 기동에 수 초가 걸린다.
      HEALTH_TIMEOUT: "90"
    steps:
      - name: Check required variables
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
          # Project EC2와 다른 인스턴스이고 키페어도 다르다. EC2_SSH_PRIVATE_KEY로
          # 대체하면 Permission denied만 나와서 원인을 찾기 어려우므로 전용 secret을
          # 필수로 둔다.
          SSH_PRIVATE_KEY: ${{ secrets.MONITORING_EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=""
          for name in EC2_HOST SSH_PRIVATE_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::필수 설정값이 비어 있습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MONITORING_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync monitoring config
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '$TARGET_DIR'"

          # ops-agent(#447)는 build context가 TARGET_DIR 전체라 uv workspace 전체가 있어야 `uv sync --locked`가 통과한다(부분 트리로 실제 빌드해 확인) — deploy-orchestration.yml처럼 저장소 전체를 보낸다.
          # .env/statsd/*.pem은 인스턴스에만 있는 파일이라 --delete로 지워지지 않게 제외한다.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='**/.venv/' \
            --exclude='data/' \
            --exclude='dist/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='statsd/' \
            --exclude='*.pem' \
            -e 'ssh -o StrictHostKeyChecking=yes' \
            ./ "${EC2_USER}@${EC2_HOST}:${TARGET_DIR}/"

      # .env는 저장소에 없고 인스턴스에서 사람이 만든다. 없으면 compose가
      # Project/Spark EC2 private IP 필수값 오류로 죽는데 원인이 바로 보이지
      # 않으므로 여기서 먼저 잡는다.
      - name: Check env file on instance
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
        run: |
          set -euo pipefail

          if ! ssh "${EC2_USER}@${EC2_HOST}" "test -f '$TARGET_DIR/infra/monitoring/.env'"; then
            echo "::error::$TARGET_DIR/infra/monitoring/.env 가 없습니다."
            echo "인스턴스에서 먼저 만들어야 합니다. infra/monitoring/.env.example을 참고하세요."
            exit 1
          fi

          # ops-agent(#447)의 SSH 개인키. 인스턴스에 직접 준비해야 하는 파일이라 없으면 런타임 SSH 실패로 뒤늦게 드러나므로 여기서 먼저 잡는다.
          if ! ssh "${EC2_USER}@${EC2_HOST}" "test -f '$TARGET_DIR/infra/monitoring/ops-agent/stream_processor.pem'"; then
            echo "::error::$TARGET_DIR/infra/monitoring/ops-agent/stream_processor.pem 이 없습니다."
            echo "인스턴스에서 먼저 준비해야 합니다. infra/monitoring/.env.example을 참고하세요."
            exit 1
          fi

          # 필수 변수는 monitoring.yaml이 ${VAR:?...}로 이미 선언하고 있다. config로
          # 해석해 보면 값이 비어 있을 때 여기서 걸리므로 별도 검증 로직을 두지 않는다.
          if ! ssh "${EC2_USER}@${EC2_HOST}" \
            "cd '$TARGET_DIR' \
            && docker compose --env-file infra/monitoring/.env \
                 -f infra/compose/monitoring.yaml config >/dev/null"; then
            echo "::error::.env에 필수 변수가 비어 있습니다."
            exit 1
          fi

      - name: Start monitoring stack
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
        run: |
          set -euo pipefail

          # up -d는 컨테이너 정의가 바뀐 것만 다시 만든다. prometheus.yml과 Grafana
          # datasource provisioning은 볼륨으로 마운트된 파일이라 정의가 아니어서,
          # 내용만 바뀌면 compose가 아무 일도 하지 않는다. 두 프로세스가 모두 기동
          # 시점에 설정을 읽으므로 restart로 다시 읽게 한다.
          #
          # Grafana dashboard JSON은 예외다 — provisioning의 updateIntervalSeconds가
          # 30초라 재기동 없이 반영된다.
          #
          # --build는 ops-agent(#447) 이미지를 소스 기준으로 다시 빌드한다 — build: 없는 prometheus/grafana는 영향받지 않는다.
          ssh "${EC2_USER}@${EC2_HOST}" \
            "cd '$TARGET_DIR' \
            && docker compose \
                 --env-file infra/monitoring/.env \
                 -f infra/compose/monitoring.yaml up -d --build \
            && docker compose \
                 --env-file infra/monitoring/.env \
                 -f infra/compose/monitoring.yaml restart prometheus grafana"

      # 재기동 직후에는 아직 준비되지 않아 바로 curl하면 실패한다. Grafana는 특히 수 초
      # 걸린다. compose 명령 성공만으로는 배포 성공이라 할 수 없어 여기서 확인한다.
      - name: Wait for monitoring stack
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
        run: |
          set -euo pipefail

          ssh "${EC2_USER}@${EC2_HOST}" "HEALTH_TIMEOUT='$HEALTH_TIMEOUT' bash -s" <<'EOF'
          set -euo pipefail

          # 반복 횟수가 아니라 시계로 제한한다. 횟수로 세면 curl이 max-time까지 물릴 때
          # 전체 대기가 HEALTH_TIMEOUT를 몇 배로 넘긴다.
          wait_for() {
            name="$1"
            url="$2"
            interval=3
            deadline=$(( $(date +%s) + HEALTH_TIMEOUT ))

            while [ "$(date +%s)" -lt "$deadline" ]; do
              if curl --fail --silent \
                --connect-timeout 5 --max-time 10 \
                "$url" >/dev/null 2>&1; then
                printf '[health] %s 정상\n' "$name"
                return 0
              fi
              sleep "$interval"
            done

            printf '[health] %s 실패 (%s)\n' "$name" "$url"
            docker logs --tail 30 "$name" 2>&1 || true
            return 1
          }

          wait_for prometheus http://localhost:9090/-/ready
          wait_for grafana http://localhost:3000/api/health

          # ops-agent(#447)는 포트 미공개라 curl로 확인 못 하므로 컨테이너 running 상태만 본다.
          wait_for_running() {
            name="$1"
            interval=3
            deadline=$(( $(date +%s) + HEALTH_TIMEOUT ))

            while [ "$(date +%s)" -lt "$deadline" ]; do
              status="$(docker inspect --format '{{.State.Status}}' "$name" 2>/dev/null || echo "not found")"
              if [ "$status" = "running" ]; then
                printf '[health] %s 정상(running)\n' "$name"
                return 0
              fi
              sleep "$interval"
            done

            printf '[health] %s 실패 (status=%s)\n' "$name" "$status"
            docker logs --tail 30 "$name" 2>&1 || true
            return 1
          }

          wait_for_running ops-agent
          EOF

      # 그래프에 "여기서 배포됨" 선을 찍어 지표 변화와 배포 시점을 바로 연관짓는다.
      # 새 인프라나 API 토큰 없이, 이 호스트에 이미 있는 admin 계정으로 Grafana
      # Annotation API를 호출한다(GRAFANA_ADMIN_PASSWORD는 인스턴스의 .env에만 있고
      # 이 워크플로/GitHub Secrets에는 없다 — 그래서 SSH 세션 안에서 직접 source한다).
      # 실패해도 배포 자체는 이미 끝난 뒤라 경고만 남기고 잡을 실패시키지 않는다.
      - name: Annotate deploy in Grafana
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! ssh "${EC2_USER}@${EC2_HOST}" \
            "cd '$TARGET_DIR' && DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
          set -euo pipefail
          . infra/monitoring/.env
          curl --fail --silent --show-error \
            -u "${GRAFANA_ADMIN_USER:-admin}:${GRAFANA_ADMIN_PASSWORD}" \
            -H 'Content-Type: application/json' \
            -X POST http://localhost:3000/api/annotations \
            -d "{\"text\":\"Monitoring stack deployed (commit ${DEPLOY_SHA})\",\"tags\":[\"deploy\",\"monitoring\"]}"
          EOF
          then
            echo "::warning::Grafana annotation 실패 — 배포 자체는 이미 정상 완료됨"
          fi

      - name: Job summary
        if: always()
        env:
          EC2_HOST: ${{ vars.MONITORING_EC2_HOST }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Monitoring 스택 배포 (Monitoring EC2)"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 결과 | $JOB_STATUS |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| host | \`${EC2_USER}@${EC2_HOST:-(미설정)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
