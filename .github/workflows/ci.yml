# PR마다 lock-check, lint, test를 병렬로 실행한다.
# 로컬에서 `uv lock --check` / `uv run ruff check .` / `uv run pytest`를
# 각각 실행하는 것과 동일하다.
name: CI

on:
  # develop, main 브랜치로 향하는 PR에서만 실행한다.
  pull_request:
    branches: [develop, main]

# 같은 PR에 연달아 push하면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pyproject.toml만 바뀌고 uv.lock 갱신을 빠뜨린 PR을 막는다.
  lock-check:
    name: Lock Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: On failure
        if: failure()
        run: |
          echo "::error::pyproject.toml과 uv.lock이 어긋났습니다."
          echo "의존성을 바꾼 뒤 'uv lock'을 돌리고, uv.lock도 같이 커밋하세요."
