# PR마다 아래 job들을 병렬로 실행한다.
#
#   select      무엇이 바뀌었는지 판정해 test 대상을 정한다
#   lock-check  pyproject.toml을 고치고 `uv lock`을 빠뜨린 PR을 막는다      [항상]
#   lint        ruff 정적 분석                                            [항상]
#   test        변경된 대상만, 대상별로 러너를 나눠 병렬 실행
#   workspace   워크스페이스 전체 import 검증          [공유 코드가 바뀔 때]
#   monitoring  compose/Prometheus/Grafana 설정 검증   [모니터링 설정이 바뀔 때]
#
# 로컬에서는 `make lint` / `make test`로 전체를 한 번에 검증할 수 있다.
name: CI

on:
  # develop, main 브랜치로 향하는 PR에서 실행한다. merge를 막는 게이트는 이쪽이다.
  pull_request:
    branches: [develop, main]
  # merge된 뒤에도 한 번 더 돈다. 각각 통과한 PR 둘이 합쳐져서 깨지는 경우를 다음
  # PR이 열릴 때까지 모르지 않기 위한 알람이다. 배포를 막지는 못한다 — deploy-*.yml이
  # 같은 push를 따로 받아 병렬로 돌기 때문에, 여기가 실패해도 배포는 진행된다.
  push:
    branches: [develop, main]

# 같은 PR/브랜치에 연달아 push하면 이전 실행은 취소한다.
# PR 이벤트는 PR 번호로, push 이벤트는 ref로 묶어서 서로 겹치지 않게 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 서비스끼리 서로 import하지 않고 공유 코드는 libs/de4-core 하나뿐이다. 그래서 바뀐
  # 대상만 골라도 다른 대상의 테스트가 깨질 경로가 없다. 단 공유 코드가 바뀌면 전부
  # 돌려야 하므로, 공유 경로를 각 필터에 함께 넣어 자동으로 전체 승격되게 한다.
  select:
    name: Select Targets
    runs-on: ubuntu-latest
    outputs:
      # test matrix가 그대로 쓰는 {name, pkg, paths} 배열
      targets: ${{ steps.select.outputs.targets }}
      workspace: ${{ steps.filter.outputs.workspace }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 아래 python 필터가 어떤 파일에 걸렸는지 알아야 매핑 누락을 판정할 수 있다.
          list-files: shell
          filters: |
            shared: &shared
              - 'libs/de4-core/**'
              - 'uv.lock'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            batchjobs: &batchjobs
              - *shared
              - 'services/batch-jobs/**'
            de4-core:
              - *shared
            sensor-producer:
              - *shared
              - 'services/sensor-producer/**'
            serving-api:
              - *shared
              - 'services/serving-api/**'
            orchestration:
              - *shared
              - 'services/orchestration/**'
            stream-processor:
              - *shared
              - 'services/stream-processor/**'
            dashboard:
              - *shared
              - 'services/dashboard/**'
            batch-jobs-sensor-features: *batchjobs
            batch-jobs-cleansing: *batchjobs
            batch-jobs-rest: *batchjobs
            # tests/integration은 7개 패키지를 모두 import하므로 전체 설치가 필요하다.
            # 자체 테스트가 없는 서비스는 이 job만이 import를 검증한다.
            workspace:
              - *shared
              - 'services/dashboard/**'
              - 'services/gold-loader/**'
              - 'tests/**'
            # 바뀐 Python 파일 목록을 받기 위한 필터다. 이 목록 중 위 필터가 담당하지
            # 않는 경로가 있으면 아래 스텝이 전체 대상으로 승격한다. 여기서 '!' 제외
            # 패턴을 쓰면 안 된다 — paths-filter는 기본 설정에서 negation을 무시하므로
            # 모든 Python 변경이 승격되어 버린다.
            python:
              - '**/*.py'
            # 모니터링 설정은 Python이 아니라서 위 필터에 걸리지 않는다. 배포는
            # deploy-monitoring.yml이 따로 판정하고, 여기서는 검증만 한다.
            monitoring:
              - 'infra/compose/monitoring.yaml'
              - 'infra/compose/exporters.yaml'
              - 'infra/monitoring/**'
              - '.github/workflows/ci.yml'

      # 필터 이름을 (uv 패키지, pytest 경로) 쌍으로 바꾼다.
      #
      # batch-jobs는 패키지 단위로만 나누면 한 러너가 Spark를 3.5분 붙잡으므로 셋으로
      # 쪼갠다. Spark 무게가 test_sensor_features.py와 cleansing에 몰려 있어 그 둘을
      # 떼어내고, rest는 --ignore를 쓴 catch-all로 둔다. 그래야 batch-jobs에 테스트
      # 파일을 새로 추가해도 어느 샤드에도 안 들어가 누락되는 일이 없다.
      - name: Resolve targets
        id: select
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
          # 값을 run 스크립트에 직접 보간하지 않고 환경변수로 받는다 (파일명에 셸
          # 특수문자가 있을 수 있다).
          PYTHON_FILES: ${{ steps.filter.outputs.python_files }}
        run: |
          set -euo pipefail
          echo "걸린 필터: $MATCHED"
          bj=services/batch-jobs/tests
          map=$(jq -cn --arg bj "$bj" '{
            "de4-core":                   {pkg: "de4-core",         paths: "libs/de4-core/tests"},
            "sensor-producer":            {pkg: "sensor-producer",  paths: "services/sensor-producer/tests"},
            "serving-api":                {pkg: "serving-api",      paths: "services/serving-api/tests"},
            "orchestration":              {pkg: "orchestration",    paths: "services/orchestration/tests"},
            "stream-processor":           {pkg: "stream-processor", paths: "services/stream-processor/tests"},
            "dashboard":                  {pkg: "dashboard",        paths: "services/dashboard/tests"},
            "batch-jobs-sensor-features": {pkg: "batch-jobs",       paths: ($bj + "/test_sensor_features.py")},
            "batch-jobs-cleansing":       {pkg: "batch-jobs",       paths: ($bj + "/cleansing")},
            "batch-jobs-rest":            {pkg: "batch-jobs",       paths: ($bj + " --ignore=" + $bj + "/test_sensor_features.py --ignore=" + $bj + "/cleansing")}
          }')

          # 바뀐 Python 파일 중 위 필터가 담당하지 않는 경로를 찾는다. 새 서비스를
          # 추가하고 필터를 빠뜨렸을 때 그 테스트가 조용히 스킵되는 것을 막는다.
          # 서비스를 추가하면 위에 필터를 만들고 아래 목록에도 함께 넣는다.
          unmapped=""
          for path in $PYTHON_FILES; do
            case "$path" in
              libs/de4-core/* | tests/* | \
              services/batch-jobs/* | services/dashboard/* | services/gold-loader/* | \
              services/orchestration/* | services/sensor-producer/* | \
              services/serving-api/* | services/stream-processor/*) ;;
              *) unmapped="$unmapped $path" ;;
            esac
          done

          if [ -n "$unmapped" ]; then
            echo "::notice::필터가 담당하지 않는 Python 경로가 바뀌어 전체 대상으로 승격합니다:$unmapped"
            selected=$(jq -c 'keys' <<<"$map")
          else
            selected="$MATCHED"
          fi

          # map에 없는 필터 이름(shared, batchjobs, workspace, python)은 떨어뜨린다.
          targets=$(jq -c --argjson m "$map" \
            '[ .[] | select(in($m)) | {name: ., pkg: $m[.].pkg, paths: $m[.].paths} ]' \
            <<<"$selected")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          jq -r '"선택된 대상: " + (if length == 0 then "(없음)" else ([.[].name] | join(", ")) end)' <<<"$targets"

  # pyproject.toml만 바뀌고 uv.lock 갱신을 빠뜨린 PR을 막는다.
  lock-check:
    name: Lock Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: On failure
        if: failure()
        run: |
          echo "::error::pyproject.toml과 uv.lock이 어긋났습니다."
          echo "의존성을 바꾼 뒤 'uv lock'을 돌리고, uv.lock도 같이 커밋하세요."

  # ruff로 미사용 import/변수 등 정적 분석 오류를 검사한다.
  # ruff만 쓰므로 워크스페이스 전체가 아니라 루트 dev 그룹만 설치한다.
  # ruff 버전은 기존과 동일하게 uv.lock이 고정한다.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Run ruff
        run: uv run --only-group dev --frozen ruff check .

  # 대상별로 러너를 나눈다. 서로 의존이 없어서, 기다리는 시간이 모든 대상의 합이 아니라
  # 가장 오래 걸리는 하나로 줄어든다.
  # 전에는 한 job에서 순차로 돌려 5분이었고, 그중 3.5~4분이 Spark였다.
  test:
    name: Test (${{ matrix.target.name }})
    needs: select
    # 대상이 하나도 없으면 job 자체가 뜨지 않는다 (빈 matrix는 에러라 먼저 거른다).
    if: needs.select.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 대상이 깨져도 나머지 결과를 봐야 어디까지 성한지 안다.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          # 대상마다 필요한 의존성이 달라 캐시도 나눈다. 하나로 두면 동시에 뜬
          # job들이 같은 캐시 키에 서로 다른 내용을 쓰려고 경쟁한다.
          cache-suffix: ${{ matrix.target.name }}

      - name: Run pytest
        env:
          PKG: ${{ matrix.target.pkg }}
          # --ignore 플래그가 섞여 있어 단어 분리가 필요하다 (아래에서 따옴표 없이 쓴다).
          PATHS: ${{ matrix.target.paths }}
        run: uv run --package "$PKG" --group dev --frozen pytest $PATHS

  # tests/integration은 7개 패키지를 모두 import하므로 전체 설치가 필요하다.
  # 위 test job들과 달리 이것만 --all-packages를 쓴다.
  workspace:
    name: Workspace Imports
    needs: select
    if: needs.select.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Run pytest
        run: uv run --all-packages --frozen pytest tests/integration

  # 모니터링 설정에는 테스트가 없다. 잘못 고치면 배포가 끝난 뒤 Prometheus나
  # Grafana 컨테이너가 죽어서야 알게 되므로, PR에서 문법과 정합성만 먼저 본다.
  monitoring-config:
    name: Monitoring Config
    needs: select
    if: needs.select.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-suffix: monitoring-config

      # monitoring.yaml은 두 값이 비면 :? 로 죽는다. 파일 구조만 보는 것이므로
      # 실제 값 대신 자리표시자를 넣는다. 인스턴스의 .env는 CI에 없다.
      - name: Validate compose files
        env:
          PROJECT_EC2_PRIVATE_IP: 10.0.0.1
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          docker compose -f infra/compose/monitoring.yaml config --quiet
          docker compose -f infra/compose/exporters.yaml config --quiet

      # 컨테이너가 쓰는 것과 같은 버전의 promtool로 본다. 이미지 태그를 compose에서
      # 뽑아 쓰므로, Prometheus를 올려도 검사 버전이 따라간다.
      - name: Check Prometheus config
        run: |
          set -euo pipefail

          image=$(grep -oE 'prom/prometheus:[^[:space:]]+' infra/compose/monitoring.yaml | head -1)
          echo "promtool 이미지: $image"

          docker run --rm --entrypoint promtool \
            --volume "$PWD/infra/monitoring/prometheus:/cfg:ro" \
            "$image" check config /cfg/prometheus.yml

      # Grafana는 설정 검사 CLI가 없다. 대신 provisioning YAML과 대시보드 JSON이
      # 파싱되는지, provider가 가리키는 경로가 compose의 마운트 지점과 맞는지 본다.
      # 경로가 어긋나면 Grafana는 조용히 대시보드를 하나도 안 띄운다.
      - name: Validate Grafana provisioning
        run: |
          set -euo pipefail

          uv run --with pyyaml --no-project python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          errors = []
          grafana = Path("infra/monitoring/grafana")

          provisioning = sorted(grafana.glob("provisioning/**/*.yml"))
          if not provisioning:
              errors.append("provisioning YAML을 하나도 찾지 못했습니다")

          for path in provisioning:
              try:
                  loaded = yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: YAML 파싱 실패 - {exc}")
                  continue
              if not isinstance(loaded, dict) or "apiVersion" not in loaded:
                  errors.append(f"{path}: apiVersion이 없습니다")

          dashboards = sorted(grafana.glob("dashboards/*.json"))
          if not dashboards:
              errors.append("대시보드 JSON을 하나도 찾지 못했습니다")

          for path in dashboards:
              try:
                  json.loads(path.read_text())
              except json.JSONDecodeError as exc:
                  errors.append(f"{path}: JSON 파싱 실패 - {exc}")

          # provider가 가리키는 컨테이너 경로가 compose의 마운트 지점과 같아야 한다.
          compose = yaml.safe_load(Path("infra/compose/monitoring.yaml").read_text())
          mounts = {
              volume.split(":")[1]
              for volume in compose["services"]["grafana"]["volumes"]
              if ":" in volume
          }

          providers = yaml.safe_load(
              (grafana / "provisioning/dashboards/dashboards.yml").read_text()
          )
          for provider in providers.get("providers", []):
              path = provider.get("options", {}).get("path")
              if path not in mounts:
                  errors.append(
                      f"provider {provider.get('name')}의 path {path} 가 "
                      f"monitoring.yaml의 grafana 마운트 {sorted(mounts)} 에 없습니다"
                  )

          for error in errors:
              print(f"::error::{error}")

          print(
              f"검사 완료 — provisioning {len(provisioning)}개, "
              f"대시보드 {len(dashboards)}개"
          )
          sys.exit(1 if errors else 0)
          PY

  # 브랜치 보호의 required status check으로는 이 job 하나만 지정한다.
  # 위 job들은 변경 내용에 따라 스킵되고 matrix 때문에 이름도 늘어난다. 개별 job을
  # required로 걸면 스킵된 job이 pending으로 남아 PR이 merge되지 않는다.
  ci-passed:
    name: CI Passed
    needs: [select, lock-check, lint, test, workspace, monitoring-config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "선행 job 결과: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              # 스킵은 "돌릴 필요가 없었다"는 뜻이므로 통과로 본다.
              success | skipped) ;;
              *)
                echo "::error::선행 job이 통과하지 못했습니다 ($result)."
                exit 1
                ;;
            esac
          done
