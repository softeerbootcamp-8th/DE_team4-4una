services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "project-ec2:${PROJECT_EC2_PRIVATE_IP:?PROJECT_EC2_PRIVATE_IP is required}"
      - "spark-ec2:${SPARK_EC2_PRIVATE_IP:?SPARK_EC2_PRIVATE_IP is required}"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.8
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # provisioning/alerting/contact-points.yaml의 slack receiver가 참조한다(#447) — ops-agent와 같은 Slack Bot Token/채널을 재사용한다.
      GRAFANA_SLACK_BOT_TOKEN: ${OPS_AGENT_SLACK_BOT_TOKEN:?OPS_AGENT_SLACK_BOT_TOKEN is required}
      GRAFANA_SLACK_ALERT_CHANNEL: ${OPS_AGENT_SLACK_ALERT_CHANNEL:?OPS_AGENT_SLACK_ALERT_CHANNEL is required}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Grafana alert 재검증/진단/remediation/Slack 알림(#447). ECR을 거치지 않고 Monitoring EC2에서 저장소 전체를 build context로 직접 빌드한다.
  ops-agent:
    build:
      context: ../..
      dockerfile: services/ops-agent/Dockerfile
    container_name: ops-agent
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      SLACK_BOT_TOKEN: ${OPS_AGENT_SLACK_BOT_TOKEN:?OPS_AGENT_SLACK_BOT_TOKEN is required}
      SLACK_ALERT_CHANNEL: ${OPS_AGENT_SLACK_ALERT_CHANNEL:?OPS_AGENT_SLACK_ALERT_CHANNEL is required}
      # architecture.md와 배포 워크플로의 EC2 설명이 어긋나 기본값을 두지 않는다(#447) — .env에 실제 값을 채워야 한다.
      STREAM_PROCESSOR_SSH_HOST: ${STREAM_PROCESSOR_SSH_HOST:?STREAM_PROCESSOR_SSH_HOST is required}
      STREAM_PROCESSOR_SSH_USER: ${STREAM_PROCESSOR_SSH_USER:-ec2-user}
      STREAM_PROCESSOR_SSH_KEY_PATH: /run/ops-agent/stream_processor.pem
      # serving-api / node-exporter restart 대상(#547). 위와 같은 이유로 기본값을 두지 않는다.
      PROJECT_SSH_HOST: ${PROJECT_SSH_HOST:?PROJECT_SSH_HOST is required}
      PROJECT_SSH_USER: ${PROJECT_SSH_USER:-ec2-user}
      PROJECT_SSH_KEY_PATH: /run/ops-agent/project.pem
      DAG_OWNERS_CONFIG_PATH: /etc/de4/dag_owners.yaml
      OPS_AGENT_INCIDENT_STORE_PATH: /data/ops_agent_incidents.sqlite3
    volumes:
      - ../../config/dag_owners.yaml:/etc/de4/dag_owners.yaml:ro
      # 커밋되지 않는 파일이다(.gitignore의 *.pem) — Monitoring EC2에 직접 준비해야 한다.
      - ../monitoring/ops-agent/stream_processor.pem:/run/ops-agent/stream_processor.pem:ro
      - ../monitoring/ops-agent/project.pem:/run/ops-agent/project.pem:ro
      - ops-agent-data:/data
    networks:
      - monitoring
    depends_on:
      - prometheus
    # Grafana가 de4-monitoring 네트워크 안에서 http://ops-agent:8080으로 붙으므로 ports를 publish하지 않는다.

  # Monitoring EC2 자신의 host 메트릭 — 같은 monitoring 네트워크라 IP/extra_hosts 없이 Docker DNS로 scrape한다.
  monitoring-node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - monitoring

  # Monitoring EC2 컨테이너별 CPU/Memory — exporters.yaml의 cAdvisor 블록 재사용.
  monitoring-cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring

  # Grafana/Prometheus/Ops Agent를 외부에서 HTTP로 probe해 self-health를 Prometheus에 저장한다.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
      - grafana
      - ops-agent

volumes:
  prometheus-data:
  grafana-data:
  ops-agent-data:

networks:
  monitoring:
    name: de4-monitoring
