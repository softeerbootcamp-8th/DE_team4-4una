x-airflow-env: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW_HOME: ${AIRFLOW_HOME}
    # hourly_pipeline의 sensor_processing task가 host에 batch-jobs 컨테이너를
    # 직접 띄우기 위한 임시(로컬 전용) 배선. EMR Serverless 연결(ADR 0001,
    # 후속 이슈) 시 HOST_PROJECT_DIR/BATCH_JOBS_IMAGE_TAG와 docker socket 마운트를
    # 통째로 제거한다.
    HOST_PROJECT_DIR: ${PWD}
    BATCH_JOBS_IMAGE_TAG: ${BATCH_JOBS_IMAGE_TAG}
    CLEANSING_BRONZE_INPUT_PATH: ${CLEANSING_BRONZE_INPUT_PATH}
    CLEANSING_QUARANTINE_OUTPUT_PATH: ${CLEANSING_QUARANTINE_OUTPUT_PATH}
    CLEANSING_CONFIG_PATH: ${CLEANSING_CONFIG_PATH}
    HOURLY_SEGMENT_FEATURE_ROAD_SEGMENT_PATH: ${HOURLY_SEGMENT_FEATURE_ROAD_SEGMENT_PATH}
    HOURLY_SEGMENT_FEATURE_OUTPUT_PATH: ${HOURLY_SEGMENT_FEATURE_OUTPUT_PATH}
    HOURLY_SEGMENT_FEATURE_EVENT_CONFIG_PATH: ${HOURLY_SEGMENT_FEATURE_EVENT_CONFIG_PATH}
    HOURLY_SEGMENT_FEATURE_STEERING_CONFIG_PATH: ${HOURLY_SEGMENT_FEATURE_STEERING_CONFIG_PATH}
    HOURLY_SEGMENT_FEATURE_MAP_MATCHING_CONFIG_PATH: ${HOURLY_SEGMENT_FEATURE_MAP_MATCHING_CONFIG_PATH}
    # sensor_processing task의 필수 실행 설정. target_hour와 run_id는 Airflow 실행
    # 컨텍스트에서 직접 전달한다(hourly_pipeline.py 참고).
    HOURLY_SEGMENT_FEATURE_ROAD_SNAPSHOT_DATE: ${HOURLY_SEGMENT_FEATURE_ROAD_SNAPSHOT_DATE}
    HOURLY_SEGMENT_FEATURE_VERSION: ${HOURLY_SEGMENT_FEATURE_VERSION}
    # hourly_pipeline의 scoring task가 쓰는 값. run_id는 여기 포함하지 않고
    # Airflow의 `{{ run_id }}` 템플릿으로 직접 전달한다(hourly_pipeline.py 참고).
    HOURLY_COMFORT_INPUT_PATH: ${HOURLY_COMFORT_INPUT_PATH}
    HOURLY_COMFORT_OUTPUT_PATH: ${HOURLY_COMFORT_OUTPUT_PATH}
    HOURLY_COMFORT_REJECTED_OUTPUT_PATH: ${HOURLY_COMFORT_REJECTED_OUTPUT_PATH}
    HOURLY_COMFORT_SCORING_CONFIG_PATH: ${HOURLY_COMFORT_SCORING_CONFIG_PATH}
    # hourly_pipeline의 publish task가 쓰는 값. as_of는 여기 포함하지 않고
    # Airflow의 `{{ data_interval_end.isoformat() }}` 템플릿으로 직접 전달한다
    # (hourly_pipeline.py 참고). POSTGRES_*는 SegmentComfortScoreJobConfig.from_env()가
    # 필수로 요구한다(빈 값이면 즉시 실패, 조용한 기본값 대체 없음).
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # data_quality_audit DAG(#253)가 audit-gold task에 전달하는 값. GX Data
    # Docs를 S3에 업로드하는 데 쓴다(ADR-0004, spec §1).
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    GOLD_AUDIT_S3_BUCKET: ${GOLD_AUDIT_S3_BUCKET}
    AWS_REGION: ${AWS_REGION}
    # webserver/scheduler/dag-processor가 서로 다른 secret_key를 랜덤 생성하면
    # 웹 UI가 scheduler의 로그 서버(8793)에서 task 로그를 못 가져온다(서명 검증 실패).
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1-python3.12
  environment:
    <<: *airflow-env
  volumes:
    - ../../services/orchestration/dags:${AIRFLOW_HOME}/dags

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: ["airflow", "db", "migrate"]

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # LocalExecutor는 task를 scheduler 프로세스 안에서 실행하므로, host의 docker에
    # 위임하는(docker-outside-of-docker) BashOperator나 weather_pipeline(#207)의
    # PythonOperator 둘 다 이 컨테이너에서만 동작하면 된다 — dag-processor/webserver는
    # task를 실행하지 않으므로 아래 jobs 배선이 필요 없다.
    environment:
      <<: *airflow-env
      # weather_pipeline이 PythonOperator에서 jobs.weather를 임포트하기 위한 배선.
      # jobs/를 아래 마운트하고 PYTHONPATH에 그 부모를 잡아 `from jobs.weather import ...`가
      # 되게 한다. jobs.weather는 함수 안에서만 임포트되므로(지연 임포트) dag-processor는
      # 이 값이 없어도 DAG를 정상 파싱한다.
      PYTHONPATH: ${AIRFLOW_HOME}/orchestration
      ZONE_MASTER_PATH: ${AIRFLOW_HOME}/data/reference/tlc_zone/zone_master.parquet
      # weather_pipeline(#222)이 15분마다 zone_weather_snapshot Parquet 이력을 쓰는 경로.
      ZONE_WEATHER_SNAPSHOT_DATA_LAKE_URI: ${AIRFLOW_HOME}/data/local-lake/bronze/zone_weather_snapshot
      # bronze_compaction(#271)이 압축할 두 Bronze 대상의 로컬 경로.
      BRONZE_COMPACTION_SENSOR_EVENTS_URI: ${AIRFLOW_HOME}/data/local-lake/bronze/sensor-events
      BRONZE_COMPACTION_ZONE_WEATHER_SNAPSHOT_URI: ${AIRFLOW_HOME}/data/local-lake/bronze/zone_weather_snapshot
      # current_score(#217)는 segment -> zone 매핑을 road_segment Parquet에서 읽는다.
      CURRENT_SCORE_ROAD_SEGMENT_PATH: ${AIRFLOW_HOME}/data/processed/road_segment
      CURRENT_SCORE_ROAD_SNAPSHOT_DATE: ${HOURLY_SEGMENT_FEATURE_ROAD_SNAPSHOT_DATE}
      # 공식 이미지에 없는 최소 의존성을 로컬 개발용으로만 설치한다(운영에는 부적합 —
      # 매 기동마다 pip install이 돌아 느리다). 이미지를 다시 빌드하게 되면 제거한다.
      # great-expectations/pandas는 current_score_quarantine(#251)의 행 단위 GX 검증용.
      _PIP_ADDITIONAL_REQUIREMENTS: "requests>=2.32,<3.0 psycopg2-binary>=2.9,<3.0 pyarrow>=25.0.1 great-expectations>=1.21.0 pandas>=2.0.0"
    volumes:
      - ../../services/orchestration/dags:${AIRFLOW_HOME}/dags
      - ../../services/orchestration/jobs:${AIRFLOW_HOME}/orchestration/jobs
      # weather_pipeline의 task가 실제로 실행되는 컨테이너에만 필요 — zone_master.parquet 읽기용(:ro).
      - ../../data/reference:${AIRFLOW_HOME}/data/reference:ro
      # current_score의 road_segment 읽기용(:ro). batch-jobs task가 docker로 마운트하는 것과 같은 경로다.
      - ../../data/processed:${AIRFLOW_HOME}/data/processed:ro
      # zone_weather_snapshot Parquet을 쓰는 대상이라 다른 마운트와 달리 쓰기 가능해야 한다.
      - ../../data/local-lake:${AIRFLOW_HOME}/data/local-lake
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    name: de4-local
