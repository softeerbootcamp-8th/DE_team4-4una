services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    # 기본 브리지 네트워크에서는 컨테이너 안의 localhost가 자기 자신을 가리켜
    # kafka에 못 붙는다 — sensor-producer(#316)/stream-processor(#323)와 같은 이유로
    # host network + localhost를 쓴다.
    network_mode: host
    command:
      - --kafka.server=localhost:9092
    depends_on:
      - kafka
