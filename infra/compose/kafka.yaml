services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      # EC2 내부 클라이언트는 localhost:9092, 외부 producer는 9094를 사용한다.
      - "127.0.0.1:9092:9092"
      - "9094:9094"
    # 기본 log.dirs(/tmp/kraft-combined-logs)는 컨테이너 파일시스템 안이라 recreate 시
    # 사라진다. 이미지 Dockerfile이 VOLUME으로 선언한 /var/lib/kafka/data로
    # log.dirs를 옮겨 named volume에 담는다(KAFKA_ 접두사 env var는 KafkaDockerWrapper가
    # '_'를 '.'로 바꿔 그대로 server.properties 키에 반영한다 — KAFKA_LOG_DIRS -> log.dirs).
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 보존 정책(#481). 이 값이 없으면 유일한 제한이 log.retention.hours 기본값
      # 168시간(7일)뿐인데, zstd 적용 후 1.59 GB/hour 기준 7일은 267 GB라 실질적으로
      # 무제한이다. 이 볼륨은 Airflow/serving-api/dashboard와 공유하므로 Kafka가
      # 디스크를 채우면 broker만 죽는 게 아니라 scheduler와 API까지 멈춘다.
      #
      # retention은 produce를 거부하지 않는다 -- 상한을 넘으면 가장 오래된 segment를
      # 지워 자리를 만든다. 즉 쓰기를 막는 장치가 아니라, 디스크가 꽉 차서 쓰기가
      # 막히는 상황을 막는 장치다.
      #
      # 12시간을 고른 근거: Kafka는 consumer가 읽었는지 확인하지 않고 삭제하므로
      # 보존 기간은 곧 stream-processor 장애를 발견해 복구하기까지의 시간이다.
      # 1시간 이내 복구는 파이프라인이 흡수하고(standard_score_pipeline이 매시 정각에
      # 직전 시간 Bronze를 읽는다), 발견은 그 DAG의 매시간 Slack 알림에 실리는
      # feature_count가 0인 것으로 이루어진다 -- 야간이면 8~12시간이 걸린다.
      # 그보다 긴 미발견은 디스크가 아니라 알림으로 풀 문제다.
      KAFKA_LOG_RETENTION_HOURS: 12
      # partition당 값이다. 3 partition이므로 topic 실제 상한은 19.2 GiB.
      KAFKA_LOG_RETENTION_BYTES: 6871947674
      # 기본값 1 GiB로는 상한 제어가 거칠다. Kafka는 segment 단위로만 삭제하고
      # active segment는 지우지 못하므로, segment가 크면 실사용량이 상한을 넘을 수 있다.
      KAFKA_LOG_SEGMENT_BYTES: 268435456
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    # 기본 브리지 네트워크에서는 컨테이너 안의 localhost가 자기 자신을 가리켜
    # kafka에 못 붙는다 — sensor-producer(#316)/stream-processor(#323)와 같은 이유로
    # host network + localhost를 쓴다.
    network_mode: host
    command:
      - --kafka.server=localhost:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  # 실제 이름을 고정한다 — 안 그러면 Compose project 이름(배포 디렉터리명, -p 옵션)에 따라
  # <project>_kafka-data로 달라져서, 그 값이 바뀌면 기존 데이터를 못 찾고 새 빈 volume이 생긴다.
  kafka-data:
    name: de4-kafka-data
