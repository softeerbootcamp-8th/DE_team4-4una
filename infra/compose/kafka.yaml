services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      # EC2 내부 클라이언트는 localhost:9092, 외부 producer는 9094를 사용한다.
      - "127.0.0.1:9092:9092"
      - "9094:9094"
    # 기본 log.dirs(/tmp/kraft-combined-logs)는 컨테이너 파일시스템 안이라 recreate 시
    # 사라진다. 이미지 Dockerfile이 VOLUME으로 선언한 /var/lib/kafka/data로
    # log.dirs를 옮겨 named volume에 담는다(KAFKA_ 접두사 env var는 KafkaDockerWrapper가
    # '_'를 '.'로 바꿔 그대로 server.properties 키에 반영한다 — KAFKA_LOG_DIRS -> log.dirs).
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    # 기본 브리지 네트워크에서는 컨테이너 안의 localhost가 자기 자신을 가리켜
    # kafka에 못 붙는다 — sensor-producer(#316)/stream-processor(#323)와 같은 이유로
    # host network + localhost를 쓴다.
    network_mode: host
    command:
      - --kafka.server=localhost:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  # 실제 이름을 고정한다 — 안 그러면 Compose project 이름(배포 디렉터리명, -p 옵션)에 따라
  # <project>_kafka-data로 달라져서, 그 값이 바뀌면 기존 데이터를 못 찾고 새 빈 volume이 생긴다.
  kafka-data:
    name: de4-kafka-data
