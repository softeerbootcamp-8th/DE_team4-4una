# Grafana(/api/health), Prometheus(/-/ready), Ops Agent(/health)를 외부에서 HTTP로
# probe하기 위한 blackbox_exporter 설정(#monitoring self-health). 세 서비스 모두
# 200 응답이면 정상이라 http_2xx 모듈 하나로 충분하다 — 대상별 모듈을 따로 두지
# 않는다.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
