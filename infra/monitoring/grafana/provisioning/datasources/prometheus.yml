apiVersion: 1

# 기존에 이미 떠 있던 Grafana는 이 datasource를 uid 없이(자동생성값으로) 가지고 있어서,
# uid를 나중에 못박으면 "data source not found"로 provisioning이 죽는다(실제로 겪음).
# 이 delete는 1회성 마이그레이션용이다 — 정상 전환 확인되면 지워도 된다(매 기동마다
# 삭제→재생성하는 부담을 없애기 위함, #447).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # ops-agent(#447)의 alert rule이 datasourceUid로 고정 참조한다 — 기존 대시보드는 이름 기반이라 영향 없음(실제 Grafana로 검증).
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
