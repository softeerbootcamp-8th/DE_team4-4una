# Grafana alert를 ops-agent(#447)와 Slack에 병렬로 전달하는 contact point.
# 같은 contact point 안의 receiver 두 개는 alert마다 둘 다 호출된다 — ops-agent가
# 죽거나 느려도 "장애 발생" 알림 자체는 Grafana가 직접 Slack으로 보내 살아있게 하기
# 위함이다(Agent의 진단/조치/복구 결과 알림은 별개로 orchestrator.py가 나중에 보낸다).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-agent
    receivers:
      - uid: ops-agent-webhook
        type: webhook
        settings:
          url: http://ops-agent:8080/webhooks/grafana
          httpMethod: POST
      - uid: ops-agent-slack-initial
        type: slack
        settings:
          token: $GRAFANA_SLACK_BOT_TOKEN
          recipient: $GRAFANA_SLACK_ALERT_CHANNEL
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [Grafana] {{ .CommonLabels.alertname }}'
          text: |
            상태: {{ if eq .Status "firing" }}발생{{ else }}해결{{ end }}
            {{ range .Alerts }}알림: {{ .Labels.alertname }}
            심각도: {{ .Labels.severity }}
            발생 시각: {{ .StartsAt | date "2006-01-02 15:04:05 MST" }} (한국시간: {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }})
            {{ if eq $.Status "resolved" }}해결 시각: {{ .EndsAt | date "2006-01-02 15:04:05 MST" }} (한국시간: {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }}){{ end }}
            {{ .Annotations.summary }}
            평가 값: {{ .ValueString }}
            {{ if .DashboardURL }}Dashboard: {{ .DashboardURL }}{{ end }}
            {{ end }}
            발신: Grafana 최초 감지 알림

  # 인프라 alert 전용(#504). 최초 Slack 형식은 공통으로 맞추되,
  # stream-processor 전용인 ops-agent webhook을 불필요하게 호출하지 않는다.
  # Slack 자격증명은 ops-agent와 같은 env var를 재사용한다 -- 새 시크릿이 없다.
  # rules.yaml의 infrastructure 그룹(EC2 host alert + self-health alert)이 전부
  # service: infrastructure 라벨로 이 contact point를 그대로 재사용한다.
  - orgId: 1
    name: infra-slack
    receivers:
      - uid: infra-slack-notify
        type: slack
        settings:
          token: $GRAFANA_SLACK_BOT_TOKEN
          recipient: $GRAFANA_SLACK_ALERT_CHANNEL
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [Grafana] {{ .CommonLabels.alertname }}'
          text: |
            상태: {{ if eq .Status "firing" }}발생{{ else }}해결{{ end }}
            {{ range .Alerts }}알림: {{ .Labels.alertname }}
            심각도: {{ .Labels.severity }}
            발생 시각: {{ .StartsAt | date "2006-01-02 15:04:05 MST" }} (한국시간: {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }})
            {{ if eq $.Status "resolved" }}해결 시각: {{ .EndsAt | date "2006-01-02 15:04:05 MST" }} (한국시간: {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }}){{ end }}
            {{ .Annotations.summary }}
            평가 값: {{ .ValueString }}
            {{ if .DashboardURL }}Dashboard: {{ .DashboardURL }}{{ end }}
            {{ end }}
            발신: Grafana 최초 감지 알림
