# stream-processor가 내려간 경우만 자동 복구 대상으로 삼는다
# 적재 지연은 Kafka에 실제 입력이 있을 때만 경고하고 자동 재시작하지 않는다
apiVersion: 1

groups:
  - orgId: 1
    name: spark-streaming
    folder: Ops Agent
    interval: 1m
    rules:
      - uid: stream-processor-down
        title: StreamProcessorDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                (4 * (up{job="stream-processor"} == bool 0) > 0)
                or (3 * (stream_processor_query_running{job="stream-processor"} == bool 0) > 0)
                or (2 * (((time() - stream_processor_last_progress_timestamp_seconds{job="stream-processor"})
                    and (stream_processor_last_progress_timestamp_seconds{job="stream-processor"} > 0)) > bool 330) > 0)
                or (1 * (stream_processor_event_time_lag_seconds{job="stream-processor"} > bool 330) > 0)
                or (0 * up{job="stream-processor"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                clamp_min(
                  scalar(sum(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}))
                  - stream_processor_kafka_end_offset_sum{job="stream-processor"}, 0)
              instant: true
              range: false
              refId: B
          - refId: D
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: stream_processor_event_time_lag_seconds{job="stream-processor"}
              instant: true
              range: false
              refId: D
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
        noDataState: NoData
        execErrState: Error
        # 1분 평가 주기에서 1회 더 지속돼야 발화시켜, 일시적인 scrape 실패는 넘기되
        # 실제 query/target 중단은 2분 안에 알린다
        for: 1m
        labels:
          service: stream-processor
          severity: critical
          auto_remediate: "true"
        annotations:
          summary: "stream-processor query 또는 Prometheus target이 중단됨"
          __dashboardUid__: "spark-streaming"
          __panelId__: "1"

      # Kafka에 실제 신규 메시지가 들어오는 동안에만 progress age를 본다
      # 무입력 상태는 batch가 돌지 않아도 정상이라 noDataState=OK로 처리한다
      - uid: bronze-ingestion-stalled
        title: BronzeIngestionStalled
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                ((time() - stream_processor_last_progress_timestamp_seconds{job="stream-processor"})
                 and (stream_processor_last_progress_timestamp_seconds{job="stream-processor"} > 0))
                and on()
                (sum(rate(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}[2m])) > 0)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: stream_processor_query_running{job="stream-processor"}
              instant: true
              range: false
              refId: B
          - refId: D
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                clamp_min(
                  scalar(sum(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}))
                  - stream_processor_kafka_end_offset_sum{job="stream-processor"}, 0)
              instant: true
              range: false
              refId: D
          - refId: E
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: stream_processor_event_time_lag_seconds{job="stream-processor"}
              instant: true
              range: false
              refId: E
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          service: stream-processor
          severity: warning
        annotations:
          summary: "Kafka 입력이 있지만 성공한 Bronze micro-batch가 90초 넘게 없음"
          __dashboardUid__: "spark-streaming"
          __panelId__: "23"

      # 정상 micro-batch 사이의 일시적 backlog는 경고하지 않는다
      # 한 배치 상한(120만 건)을 넘은 backlog가 5분간 같은 크기 이상 늘어나야 처리량 부족으로 본다
      - uid: bronze-ingestion-lag-growing
        title: BronzeIngestionLagGrowing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                ((stream_processor_event_time_lag_seconds{job="stream-processor"} > bool 90)
                 + (((clamp_min(
                        scalar(sum(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}))
                        - stream_processor_kafka_end_offset_sum{job="stream-processor"}, 0)) > bool 1200000)
                    * ((scalar(delta((sum(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}))[5m:]))
                        - delta(stream_processor_kafka_end_offset_sum{job="stream-processor"}[5m])) > bool 1200000)))
                and on()
                (sum(rate(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}[2m])) > 0)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                clamp_min(
                  scalar(sum(kafka_topic_partition_current_offset{job="kafka",topic="sensor-events"}))
                  - stream_processor_kafka_end_offset_sum{job="stream-processor"}, 0)
              instant: true
              range: false
              refId: B
          - refId: D
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: stream_processor_event_time_lag_seconds{job="stream-processor"}
              instant: true
              range: false
              refId: D
          - refId: E
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: stream_processor_query_running{job="stream-processor"}
              instant: true
              range: false
              refId: E
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          service: stream-processor
          severity: warning
        annotations:
          summary: "Kafka 입력이 계속되는 동안 Bronze event-time lag가 높거나 offset backlog가 지속적으로 증가함"
          __dashboardUid__: "spark-streaming"
          __panelId__: "24"

  # EC2 host + self-health alert 그룹 — project-disk-pressure는 DiskWarning의 상위 호환이라 지우고 여기 흡수했다.
  - orgId: 1
    name: infrastructure
    folder: Ops Agent
    interval: 1m
    rules:
      - uid: infra-node-down
        title: NodeDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: up{job=~"project-node|monitoring-node"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          service: infrastructure
          severity: critical
        annotations:
          summary: "{{ $labels.job }}({{ $labels.instance }})의 node_exporter가 2분 이상 scrape되지 않음 (spark 호스트는 SparkNodeExporterDown이 담당한다)"

      - uid: infra-high-cpu
        title: HighCPU
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                100 - (avg by (instance, job) (rate(node_cpu_seconds_total{job=~"project-node|spark-node|monitoring-node", mode="idle"}[5m])) * 100)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          service: infrastructure
          severity: warning
        annotations:
          summary: "{{ $labels.job }}({{ $labels.instance }}) CPU 사용률이 85%를 10분 이상 초과함"

      - uid: infra-high-memory
        title: HighMemory
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                100 * (1 - (avg by (instance, job) (node_memory_MemAvailable_bytes{job=~"project-node|spark-node|monitoring-node"}) / avg by (instance, job) (node_memory_MemTotal_bytes{job=~"project-node|spark-node|monitoring-node"})))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          service: infrastructure
          severity: warning
        annotations:
          summary: "{{ $labels.job }}({{ $labels.instance }}) Memory 사용률이 85%를 10분 이상 초과함"

      # mountpoint="/"로 매칭한다(device/fstype은 인스턴스 교체 시 바뀔 수 있어 안 씀).
      - uid: infra-disk-warning
        title: DiskWarning
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{job=~"project-node|spark-node|monitoring-node", mountpoint="/"} / node_filesystem_size_bytes{job=~"project-node|spark-node|monitoring-node", mountpoint="/"})
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
        noDataState: NoData
        execErrState: Error
        # 대량 segment 삭제나 이미지 pull 중 순간적으로 튀는 것에 반응하지 않게 한다(project-disk-pressure와 동일 근거).
        for: 10m
        labels:
          service: infrastructure
          severity: warning
        annotations:
          summary: "{{ $labels.job }}({{ $labels.instance }}) root filesystem 사용률이 80%를 10분 이상 초과함"

      - uid: infra-disk-critical
        title: DiskCritical
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{job=~"project-node|spark-node|monitoring-node", mountpoint="/"} / node_filesystem_size_bytes{job=~"project-node|spark-node|monitoring-node", mountpoint="/"})
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        noDataState: NoData
        execErrState: Error
        # DiskWarning보다 짧게 잡았다 — 디스크가 가득 차기 직전이라 더 빨리 반응해야 한다.
        for: 5m
        labels:
          service: infrastructure
          severity: critical
        annotations:
          summary: "{{ $labels.job }}({{ $labels.instance }}) root filesystem 사용률이 90%를 5분 이상 초과함 — 곧 디스크가 가득 참"

      # NodeDown과 달리 spark 호스트만 본다 — alertname 하나로 조치 대상이 정해져야
      # ops-agent가 라벨을 보지 않아도 된다. 호스트 자체가 죽은 경우는 SSH가 실패해
      # 자연히 escalation된다.
      # service를 infrastructure로 두면 notification-policies의 매처에 걸려
      # infra-slack으로만 가고 ops-agent를 거치지 않으므로 다른 값을 쓴다.
      - uid: spark-node-exporter-down
        title: SparkNodeExporterDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: up{job="spark-node"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          service: spark-node
          severity: high
          auto_remediate: "true"
        annotations:
          summary: "spark EC2의 node_exporter가 2분 이상 scrape되지 않음 — exporter만 죽었으면 재시작한다"

      # Grafana 자신의 죽음은 다루지 않는다 — Grafana가 죽으면 Alerting도 같이 죽는 순환 의존이라(README 참고).
      - uid: self-health-prometheus-unreachable
        title: PrometheusUnreachable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: up{job="prometheus"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        # Prometheus가 완전히 죽어 쿼리가 실패/no-data여도 장애로 취급해 알림이 나가게 한다.
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          service: infrastructure
          severity: critical
        annotations:
          summary: "Prometheus가 자기 자신을 2분 이상 scrape하지 못함 — 쿼리 실패/no-data도 장애로 간주"

      - uid: self-health-ops-agent-unreachable
        title: OpsAgentUnreachable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: probe_success{instance="http://ops-agent:8080/health"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          service: infrastructure
          severity: high
        annotations:
          summary: "blackbox_exporter가 ops-agent /health를 2분 이상 probe하지 못함 — Grafana의 최초 장애 Slack 알림은 계속 동작하지만 ops-agent의 재검증/조치/escalation은 멈춘 상태일 수 있음"

  - orgId: 1
    name: serving-api
    folder: Ops Agent
    interval: 1m
    rules:
      # metrics 서버가 uvicorn과 같은 프로세스라(serving_api/__init__.py:21) up이 곧
      # 프로세스 생사다. DB만 죽으면 앱은 살아서 metrics를 계속 내보내므로 여기 걸리지
      # 않는다 — 재시작이 무의미한 경우를 자동으로 걸러낸다.
      - uid: serving-api-down
        title: ServingApiDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: up{job="serving-api"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: NoData
        execErrState: Error
        # 배포 중 재시작을 장애로 오인하지 않게 StreamProcessorDown과 같은 값을 쓴다.
        for: 2m
        labels:
          service: serving-api
          severity: high
          auto_remediate: "true"
        annotations:
          summary: "serving-api가 2분 이상 scrape되지 않음 — 프로세스/컨테이너 문제로 보임"
