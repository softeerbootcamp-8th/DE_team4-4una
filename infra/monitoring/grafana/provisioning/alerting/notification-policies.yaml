# 모든 alert를 기본적으로 ops-agent contact point로 라우팅한다(#447). 세분화가 필요하면 routes:를 추가한다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: ops-agent
    group_by: ["alertname"]
    routes:
      # 인프라 alert(rules.yaml의 infrastructure 그룹)는 ops-agent를 거치지 않고 Slack으로만 보낸다.
      - receiver: infra-slack
        object_matchers:
          - ["service", "=", "infrastructure"]
