# 모든 alert를 기본적으로 ops-agent contact point로 라우팅한다(#447). 세분화가 필요하면 routes:를 추가한다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: ops-agent
    group_by: ["alertname"]
    routes:
      # 인프라 alert는 ops-agent를 거치지 않고 Slack으로만 보낸다 -- 자동 조치
      # 대상이 아니다(contact-points.yaml의 infra-slack 주석 참고).
      - receiver: infra-slack
        object_matchers:
          - ["service", "=", "infrastructure"]
