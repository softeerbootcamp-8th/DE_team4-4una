global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: project-node
    static_configs:
      - targets:
          - project-ec2:9100

  - job_name: project-containers
    static_configs:
      - targets:
          - project-ec2:8081
