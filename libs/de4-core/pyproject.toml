[project]
name = "de4-core"
version = "0.1.0"
description = "Shared contracts and domain primitives for DE4 services"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.40.0"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
